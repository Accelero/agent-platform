    - /opt/hindsight/start.sh
    sharedMemory: 1Gi
    readinessProbe:
      tcpSocket:
        port: http
      periodSeconds: 5
    startupProbe:
      tcpSocket:
        port: http
      periodSeconds: 5
      failureThreshold: 60
    persistence:
