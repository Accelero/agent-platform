# Application defaults. Enable services after provisioning native state and named Secrets.
existingSecret: agent-platform-secrets
imagePullPolicy: IfNotPresent
imagePullSecrets: []
multicaGithub:
  enabled: false
  appId: ''
  appSlug: ''
  existingSecret: multica-github-app
  webhookIngress:
    enabled: false
    className: ''
    host: ''
    tlsSecretName: ''
    controllerNamespace: ''
persistence:
  postgres-data:
    enabled: false
    existingClaim: ''
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  multica-uploads:
    enabled: false
    existingClaim: ''
    size: 10Gi
    accessModes:
    - ReadWriteOnce
configMaps: {}
workloads:
  shared-postgres:
    enabled: false
    kind: StatefulSet
    image: hermes-stack-postgres:dev
    env:
    - name: POSTGRES_USER
      value: stack_admin
    - name: POSTGRES_DB
      value: postgres
    secretEnv:
    - name: POSTGRES_PASSWORD
      key: SHARED_POSTGRES_PASSWORD
    - name: MULTICA_PASSWORD
      key: MULTICA_POSTGRES_PASSWORD
    ports:
    - name: postgres
      port: 5432
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 3Gi
    args:
    - postgres
    - -c
    - max_connections=200
    readinessProbe:
      tcpSocket:
        port: postgres
      periodSeconds: 5
    startupProbe:
      tcpSocket:
        port: postgres
      periodSeconds: 5
      failureThreshold: 60
    persistence:
    - name: postgres-data
      mountPath: /var/lib/postgresql/data
  multica-backend:
    enabled: false
    image: ''
    env:
    - name: DATABASE_URL
      value: postgres://multica:$(MULTICA_POSTGRES_PASSWORD)@shared-postgres:5432/multica?sslmode=disable
    - name: PORT
      value: '8080'
    - name: APP_ENV
      value: production
    - name: MULTICA_DEV_VERIFICATION_CODE
      value: ''
    - name: FRONTEND_ORIGIN
      value: http://127.0.0.1:3010
    - name: CORS_ALLOWED_ORIGINS
      value: http://localhost:3010
    - name: MULTICA_APP_URL
      value: http://127.0.0.1:3010
    - name: ALLOW_SIGNUP
      value: 'false'
    - name: ALLOWED_EMAILS
      value: owner@example.invalid
    - name: DO_NOT_TRACK
      value: '1'
    secretEnv:
    - name: MULTICA_POSTGRES_PASSWORD
      key: MULTICA_POSTGRES_PASSWORD
    - name: JWT_SECRET
      key: MULTICA_JWT_SECRET
    ports:
    - name: http
      port: 8080
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1Gi
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    readinessProbe:
      tcpSocket:
        port: http
      periodSeconds: 5
    startupProbe:
      tcpSocket:
        port: http
      periodSeconds: 5
      failureThreshold: 60
    persistence:
    - name: multica-uploads
      mountPath: /app/data/uploads
    imageKey: multica-backend
  multica-web:
    enabled: false
    image: ghcr.io/multica-ai/multica-web@sha256:b88402be269b6d4ea20bb22404b7532e4d7663f45c1c4952cf040f598398a03e
    env:
    - name: HOSTNAME
      value: 0.0.0.0
    - name: REMOTE_API_URL
      value: http://multica-backend:8080
    secretEnv: []
    ports:
    - name: http
      port: 3000
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1Gi
    readinessProbe:
      tcpSocket:
        port: http
      periodSeconds: 5
    startupProbe:
      tcpSocket:
        port: http
      periodSeconds: 5
      failureThreshold: 60
  multica-gateway:
    enabled: false
    image: nginxinc/nginx-unprivileged@sha256:906927b10cea77d8cd01cad4dc0bf8f872874ca9ff5ddbf49a0b0b0f3fc436f7
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 101
      runAsGroup: 101
      fsGroup: 101
    securityContext:
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    command:
    - nginx
    args:
    - -g
    - daemon off;
    env: []
    secretEnv: []
    ports:
    - name: http
      port: 8080
      servicePort: 80
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi
    readinessProbe:
      tcpSocket:
        port: http
      periodSeconds: 5
    volumes:
    - name: configuration
      mountPath: /etc/nginx/nginx.conf
      subPath: nginx.conf
      source:
        configMap:
          name: multica-gateway-config
    - name: runtime
      mountPath: /run/nginx
      readOnly: false
      source:
        emptyDir:
          sizeLimit: 64Mi
networkPolicy:
  enabled: true
  ingress:
    multica-backend:
    - multica-web
    - multica-gateway
    multica-gateway: []
    multica-web:
    - multica-gateway
    shared-postgres:
    - multica-backend
images:
  hermes-manager: ghcr.io/accelero/agent-platform/hermes-manager:dev
  hermes: ghcr.io/accelero/agent-platform/hermes:dev
  agent-runtime: ghcr.io/accelero/agent-platform/agent-runtime:dev
  multica-backend: ghcr.io/accelero/agent-platform/multica-backend:dev
multica:
  publicUrl: http://localhost:3010
  ownerEmail: ''
  databaseUrl: postgres://multica:$(MULTICA_POSTGRES_PASSWORD)@shared-postgres:5432/multica?sslmode=disable
  databaseCASecret: ''
  maintenanceFile: /app/data/uploads/.agent-platform-maintenance
  mailSecret: multica-mail
  mailKeys: []
# Personal Hermes: the manager (api and controller roles) and the gateway.
# Every secret comes from an existing Secret per role, with the key names listed
# in the chart README; values hold no secret material.
hermesManager:
  enabled: false
  installation:
    id: ''
    issuer: ''
  # UID/GID of every Hermes and terminal backend container.
  dataIdentity: {uid: 1000, gid: 1000}
  # Where volumes may live: {id, storageClass: {name}} | {id, localPath: {node, root}} | {id, nfs: {server, root}}.
  storageSources: []
  # The Hermes hostname and the separate administration hostname.
  publicOrigin: ''
  adminOrigin: ''
  # Each role's Secret carries `oidc-ca.crt` when the identity provider uses a private CA.
  oidcPrivateCa: false
  # Native Hermes's own OIDC client (owner-pinned login inside each instance).
  nativeClientId: hermes-native
  # Instances may reach public HTTPS addresses, such as model providers.
  publicHttps: true
  # In-cluster services instances may reach: [{namespace, labels, port}].
  serviceEgress: []
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
  api:
    enabled: true
    replicas: 1
    existingSecret: ''
    tokens:
      jwksUrl: ''
      audience: hermes-manager
      authorizedClients: [manager-admin]
    # Browser sign-in and the dashboard.
    browser:
      enabled: true
      clientId: manager-admin
      confidential: false
      scopes: [openid]
      revocationUrl: ''
      sessionKeys: {active: '', ids: []}
    # Read-only Keycloak user lookup for picking people.
    directory:
      enabled: false
      clientId: ''
    # URI SAN of the gateway's client certificate; the resolver answers only it.
    gatewayIdentity: ''
  controller:
    enabled: true
    existingSecret: ''
    serviceAccountName: hermes-manager-controller
    # ClusterRole bound into instance namespaces; defaults to a per-installation name.
    instanceRole: ''
    workers: 4
    resyncSeconds: 30
  gateway:
    enabled: true
    replicas: 1
    existingSecret: ''
    oidc:
      clientId: hermes-gateway
      confidential: false
      scopes: [openid]
      jwksUrl: ''
      audience: hermes-gateway
      revocationUrl: ''
    sessionKeys: {active: '', ids: []}
    clusterDomain: cluster.local
    maxUploadMib: 64
    service:
      type: ClusterIP
      port: 443
  # One-shot operator Jobs; enable for one upgrade, then disable.
  operations:
    # `hermes-manager migrate` with the schema owner's `database-url`.
    migrate: {enabled: false, existingSecret: ''}
    # `hermes-manager initialize` as the controller's account.
    initialize: {enabled: false}
    # `hermes-manager rebind-cluster` after restoring PostgreSQL on a new cluster.
    rebindCluster: {enabled: false}
    # `hermes-manager grant-administrator`; the Secret holds `database-url` and `identity.json`.
    grantAdministrator: {enabled: false, existingSecret: '', recover: false}
  # NetworkPolicy peers that may reach the administration API and the gateway.
  ingress:
    admin: []
    gateway: []
