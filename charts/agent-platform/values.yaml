# Application defaults. Enable services after provisioning native state and named Secrets.
existingSecret: agent-platform-secrets
imagePullPolicy: IfNotPresent
imagePullSecrets: []
multicaGithub:
  enabled: false
  appId: ''
  appSlug: ''
  existingSecret: multica-github-app
  webhookIngress:
    enabled: false
    className: ''
    host: ''
    tlsSecretName: ''
    controllerNamespace: ''
persistence:
  postgres-data:
    enabled: false
    existingClaim: ''
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  multica-uploads:
    enabled: false
    existingClaim: ''
    size: 10Gi
    accessModes:
    - ReadWriteOnce
configMaps: {}
workloads:
  shared-postgres:
    enabled: false
    kind: StatefulSet
    image: hermes-stack-postgres:dev
    env:
    - name: POSTGRES_USER
      value: stack_admin
    - name: POSTGRES_DB
      value: postgres
    secretEnv:
    - name: POSTGRES_PASSWORD
      key: SHARED_POSTGRES_PASSWORD
    - name: MULTICA_PASSWORD
      key: MULTICA_POSTGRES_PASSWORD
    ports:
    - name: postgres
      port: 5432
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 3Gi
    args:
    - postgres
    - -c
    - max_connections=200
    readinessProbe:
      tcpSocket:
        port: postgres
      periodSeconds: 5
    startupProbe:
      tcpSocket:
        port: postgres
      periodSeconds: 5
      failureThreshold: 60
    persistence:
    - name: postgres-data
      mountPath: /var/lib/postgresql/data
  multica-backend:
    enabled: false
    image: ''
    env:
    - name: DATABASE_URL
      value: postgres://multica:$(MULTICA_POSTGRES_PASSWORD)@shared-postgres:5432/multica?sslmode=disable
    - name: PORT
      value: '8080'
    - name: APP_ENV
      value: production
    - name: MULTICA_DEV_VERIFICATION_CODE
      value: ''
    - name: FRONTEND_ORIGIN
      value: http://127.0.0.1:3010
    - name: CORS_ALLOWED_ORIGINS
      value: http://localhost:3010
    - name: MULTICA_APP_URL
      value: http://127.0.0.1:3010
    - name: ALLOW_SIGNUP
      value: 'false'
    - name: ALLOWED_EMAILS
      value: owner@example.invalid
    - name: DO_NOT_TRACK
      value: '1'
    secretEnv:
    - name: MULTICA_POSTGRES_PASSWORD
      key: MULTICA_POSTGRES_PASSWORD
    - name: JWT_SECRET
      key: MULTICA_JWT_SECRET
    ports:
    - name: http
      port: 8080
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1Gi
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    readinessProbe:
      tcpSocket:
        port: http
      periodSeconds: 5
    startupProbe:
      tcpSocket:
        port: http
      periodSeconds: 5
      failureThreshold: 60
    persistence:
    - name: multica-uploads
      mountPath: /app/data/uploads
    imageKey: multica-backend
  multica-web:
    enabled: false
    image: ghcr.io/multica-ai/multica-web@sha256:b88402be269b6d4ea20bb22404b7532e4d7663f45c1c4952cf040f598398a03e
    env:
    - name: HOSTNAME
      value: 0.0.0.0
    - name: REMOTE_API_URL
      value: http://multica-backend:8080
    secretEnv: []
    ports:
    - name: http
      port: 3000
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1Gi
    readinessProbe:
      tcpSocket:
        port: http
      periodSeconds: 5
    startupProbe:
      tcpSocket:
        port: http
      periodSeconds: 5
      failureThreshold: 60
  multica-gateway:
    enabled: false
    image: nginxinc/nginx-unprivileged@sha256:906927b10cea77d8cd01cad4dc0bf8f872874ca9ff5ddbf49a0b0b0f3fc436f7
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 101
      runAsGroup: 101
      fsGroup: 101
    securityContext:
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    command:
    - nginx
    args:
    - -g
    - daemon off;
    env: []
    secretEnv: []
    ports:
    - name: http
      port: 8080
      servicePort: 80
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi
    readinessProbe:
      tcpSocket:
        port: http
      periodSeconds: 5
    volumes:
    - name: configuration
      mountPath: /etc/nginx/nginx.conf
      subPath: nginx.conf
      source:
        configMap:
          name: multica-gateway-config
    - name: runtime
      mountPath: /run/nginx
      readOnly: false
      source:
        emptyDir:
          sizeLimit: 64Mi
networkPolicy:
  enabled: true
  ingress:
    multica-backend:
    - multica-web
    - multica-gateway
    multica-gateway: []
    multica-web:
    - multica-gateway
    shared-postgres:
    - multica-backend
images:
  hermes-manager: ghcr.io/accelero/agent-platform/hermes-manager:dev
  hermes: ghcr.io/accelero/agent-platform/hermes:dev
  agent-runtime: ghcr.io/accelero/agent-platform/agent-runtime:dev
  multica-backend: ghcr.io/accelero/agent-platform/multica-backend:dev
multica:
  publicUrl: http://localhost:3010
  ownerEmail: ''
  databaseUrl: postgres://multica:$(MULTICA_POSTGRES_PASSWORD)@shared-postgres:5432/multica?sslmode=disable
  databaseCASecret: ''
  maintenanceFile: /app/data/uploads/.agent-platform-maintenance
  mailSecret: multica-mail
  mailKeys: []
# Rust administration and personal-instance control plane; opt in independently.
hermesManager:
  enabled: false
  installation:
    id: ''
    epoch: 1
    issuer: ''
  api:
    enabled: true
    existingSecret: ''
    config: {}
  controller:
    enabled: false
    existingSecret: ''
    serviceAccountName: ''
    config: {}
  routerAuth:
    enabled: false
    existingSecret: ''
    config: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  # NetworkPolicy peers, one independently scoped list for each listener.
  ingress:
    admin: []
    resolver: []
    execution: []
    routerPublic: []
    routerInternal: []
