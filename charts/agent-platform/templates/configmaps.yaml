{{- range $name, $data := .Values.configMaps }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "agent-platform.labels" $ | nindent 4 }}
data: {{ toYaml $data | nindent 2 }}
{{- end }}
{{- if (index .Values.workloads "multica-gateway").enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: multica-gateway-config
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    {{- .Files.Get "files/multica-gateway.nginx.conf" | nindent 4 }}
{{- end }}
