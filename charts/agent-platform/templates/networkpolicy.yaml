{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-platform-default-deny-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/part-of: agent-platform
  policyTypes: [Ingress]
---
{{- range $name, $sources := .Values.networkPolicy.ingress }}
{{- if (index $.Values.workloads $name).enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-ingress
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/name: {{ $name }}
  policyTypes: [Ingress]
  {{- if $sources }}
  ingress:
    - from:
        {{- range $sources }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/name: {{ . }}
        {{- end }}
      ports:
        {{- range (index $.Values.workloads $name).ports }}
        - protocol: TCP
          port: {{ .port }}
        {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
---
{{- end }}
{{- end }}
{{- range $name, $ports := .Values.networkPolicy.externalIngress }}
{{- if (index $.Values.workloads $name).enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-local-ingress
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/name: {{ $name }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        {{- range $ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
{{- end }}
{{- end }}
{{- range $name, $namespaces := .Values.networkPolicy.namespaceIngress }}
{{- if and $namespaces (index $.Values.workloads $name).enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-namespace-ingress
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/name: {{ $name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $namespace := $namespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $namespace }}
        {{- end }}
      ports:
        {{- range (index $.Values.workloads $name).ports }}
        - {protocol: TCP, port: {{ .port }}}
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
