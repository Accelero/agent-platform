{{- range $name, $workload := (include "agent-platform.workloads" . | fromJson) }}
{{- if $workload.enabled }}
{{- $github := and (eq $name "multica-backend") $.Values.multicaGithub.enabled }}
---
apiVersion: apps/v1
kind: {{ default "Deployment" $workload.kind }}
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "agent-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: 1
  {{- if eq (default "Deployment" $workload.kind) "StatefulSet" }}
  serviceName: {{ $name }}-headless
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  # Claims have explicit names and are also retained by storage.yaml. Keeping
  # this policy explicit prevents later volumeClaimTemplates from changing it.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  {{- else }}
  # A second writer must never start against the same mutable native home.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      annotations:
        checksum/application: {{ include "agent-platform.workloads" $ | sha256sum }}
        {{- if eq $name "multica-gateway" }}
        checksum/gateway: {{ $.Files.Get (printf "files/%s.nginx.conf" $name) | sha256sum }}
        {{- end }}
        {{- with $workload.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/part-of: agent-platform
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/name: {{ $name }}
    spec:
      # DNS is the service discovery contract. Legacy service-link variables
      # such as CAMOFOX_PORT would replace image numeric port defaults with URLs.
      enableServiceLinks: false
      automountServiceAccountToken: {{ default false $workload.automountServiceAccountToken }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $workload.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml (mergeOverwrite (deepCopy (default dict $workload.podSecurityContext)) (dict "seccompProfile" (dict "type" "RuntimeDefault"))) | nindent 8 }}
      {{- with $workload.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $workload.hostname }}
      hostname: {{ . }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ required (printf "workloads.%s needs an image or imageKey" $name) (default (get $.Values.images (default "" $workload.imageKey)) $workload.image) | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          securityContext:
            {{- toYaml (mergeOverwrite (deepCopy (default dict $workload.securityContext)) (dict "allowPrivilegeEscalation" false)) | nindent 12 }}
          {{- with $workload.command }}
          command: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with $workload.args }}
          args: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $workload.env $workload.secretEnv $github }}
          env:
            {{- range $env := $workload.secretEnv }}
            - name: {{ $env.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ default (default $.Values.existingSecret $workload.existingSecret) $env.secretName }}
                  key: {{ $env.key }}
            {{- end }}
            {{- range $env := $workload.env }}
            - {{ toYaml $env | nindent 14 | trim }}
            {{- end }}
            {{- if $github }}
            - name: GITHUB_APP_ID
              value: {{ required "multicaGithub.appId is required" $.Values.multicaGithub.appId | toString | quote }}
            - name: GITHUB_APP_SLUG
              value: {{ required "multicaGithub.appSlug is required" $.Values.multicaGithub.appSlug | quote }}
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "multicaGithub.existingSecret is required" $.Values.multicaGithub.existingSecret }}
                  key: MULTICA_GITHUB_AP_PRIVATE_KEY
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.multicaGithub.existingSecret }}
                  key: MULTICA_GITHUB_WEBHOOK_SECRET
            {{- end }}
          {{- end }}
          {{- with $workload.ports }}
          ports:
            {{- range . }}
            - name: {{ .name }}
              containerPort: {{ .port }}
            {{- end }}
          {{- end }}
          {{- with $workload.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with $workload.readinessProbe }}
          readinessProbe: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with $workload.startupProbe }}
          startupProbe: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $workload.persistence $workload.volumes $workload.sharedMemory }}
          volumeMounts:
            {{- range $mount := $workload.persistence }}
            - name: {{ $mount.name }}
              mountPath: {{ $mount.mountPath }}
              {{- with $mount.subPath }}
              subPath: {{ . | quote }}
              {{- end }}
              readOnly: {{ default false $mount.readOnly }}
            {{- end }}
            {{- range $volume := $workload.volumes }}
            - name: {{ $volume.name }}
              mountPath: {{ $volume.mountPath }}
              readOnly: {{ if hasKey $volume "readOnly" }}{{ $volume.readOnly }}{{ else }}true{{ end }}
              {{- with $volume.subPath }}
              subPath: {{ . | quote }}
              {{- end }}
            {{- end }}
            {{- if $workload.sharedMemory }}
            - name: shm
              mountPath: /dev/shm
            {{- end }}
          {{- end }}
      {{- if or $workload.persistence $workload.volumes $workload.sharedMemory }}
      volumes:
        {{- range $mount := $workload.persistence }}
        - name: {{ $mount.name }}
          persistentVolumeClaim:
            claimName: {{ default $mount.name (get (index $.Values.persistence $mount.name) "existingClaim") }}
        {{- end }}
        {{- range $volume := $workload.volumes }}
        - name: {{ $volume.name }}
          {{- toYaml $volume.source | nindent 10 }}
        {{- end }}
        {{- if $workload.sharedMemory }}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ $workload.sharedMemory }}
        {{- end }}
      {{- end }}
{{- end }}
{{- end }}
