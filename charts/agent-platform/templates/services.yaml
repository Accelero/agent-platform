{{- range $name, $workload := .Values.workloads }}
{{- if and $workload.enabled $workload.ports }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "agent-platform.labels" $ | nindent 4 }}
spec:
  type: {{ default "ClusterIP" (get (default dict $workload.service) "type") }}
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/name: {{ $name }}
  ports:
    {{- range $workload.ports }}
    - name: {{ .name }}
      port: {{ default .port .servicePort }}
      targetPort: {{ .name }}
      {{- with .nodePort }}
      nodePort: {{ . }}
      {{- end }}
    {{- end }}
{{- if eq (default "Deployment" $workload.kind) "StatefulSet" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-headless
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "agent-platform.labels" $ | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/name: {{ $name }}
  ports:
    {{- range $workload.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .name }}
    {{- end }}
{{- end }}

{{- end }}
{{- end }}

{{- if and .Values.runtimeManager.legacyServiceAlias (index .Values.workloads "runtime-manager").enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: execution-manager
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: runtime-manager
  ports:
    - {name: https, port: 8090, targetPort: https}
{{- end }}
