{{- if .Values.sandbox.enabled }}
{{- $roles := (include "agent-platform.runtime" . | fromJson).roles }}
{{- $policy := printf "%s-%s-workers" .Values.sandbox.namespace .Values.sandbox.policyIdentity }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $policy }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  variables:
    - name: role
      expression: "has(object.metadata.labels) && 'hermes.stack/role' in object.metadata.labels ? object.metadata.labels['hermes.stack/role'] : ''"
  validations:
    - expression: >-
        object.metadata.name.matches('^hermes-exec-[0-9a-f]{24}-[0-9a-f]{12}$') &&
        has(object.metadata.labels) &&
        'app.kubernetes.io/managed-by' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'agent-platform-runtime-manager' &&
        'hermes-execution' in object.metadata.labels &&
        object.metadata.labels['hermes-execution'].matches('^[0-9a-f]{24}$') &&
        object.metadata.name.startsWith('hermes-exec-' + object.metadata.labels['hermes-execution'] + '-')
      message: Workers must carry the execution manager's environment identity.
    - expression: >-
        object.spec.serviceAccountName == {{ toJson .Values.sandbox.workerServiceAccount }} &&
        has(object.spec.automountServiceAccountToken) && !object.spec.automountServiceAccountToken
      message: Workers must use the unprivileged sandbox service account without API tokens.
    - expression: >-
        has(object.spec.securityContext) &&
        object.spec.securityContext.runAsNonRoot == true &&
        object.spec.securityContext.runAsUser == {{ .Values.runtimeManager.uid }} &&
        object.spec.securityContext.runAsGroup == {{ .Values.runtimeManager.gid }} &&
        object.spec.containers.all(c,
          !has(c.securityContext) ||
          ((!has(c.securityContext.runAsUser) || c.securityContext.runAsUser == {{ .Values.runtimeManager.uid }}) &&
           (!has(c.securityContext.runAsGroup) || c.securityContext.runAsGroup == {{ .Values.runtimeManager.gid }})))
      message: Agent runtimes must use the configured non-root identity.
    - expression: >-
        size(object.spec.containers) == 1 &&
        (!has(object.spec.initContainers) || size(object.spec.initContainers) == 0) &&
        (!has(object.spec.ephemeralContainers) || size(object.spec.ephemeralContainers) == 0)
      message: Workers must have exactly one execution container.
    - expression: >-
        object.spec.containers.all(c,
          (!has(c.command) || size(c.command) == 0) &&
          (!has(c.args) || size(c.args) == 0) && !has(c.lifecycle))
      message: Workers must use the approved image entrypoint without command overrides.
    - expression: >-
        object.spec.containers.all(c,
          (!has(c.envFrom) || size(c.envFrom) == 0) &&
          (!has(c.env) || c.env.all(e, !has(e.valueFrom))))
      message: Workers cannot load credentials or API tokens through environment references.
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v,
          has(v.persistentVolumeClaim) || has(v.secret) || has(v.emptyDir))
      message: Only approved persistent claims, selected Secrets and temporary storage are permitted.
    - expression: >-
        {{- if not $roles }}false{{- end }}
        {{- range $index, $role := keys $roles | sortAlpha }}
        {{- if $index }} || {{ end }}
        (variables.role == {{ toJson $role }} &&
          object.spec.containers.all(c, c.image in {{ toJson (index $roles $role).images }}) &&
          object.spec.containers.all(c,
            (!has(c.env) || c.env.all(e,
              e.name in {{ toJson (default dict (index $roles $role).environment) }} &&
              has(e.value) && e.value == {{ toJson (default dict (index $roles $role).environment) }}[e.name] &&
              size(c.env.filter(other, other.name == e.name)) == 1)) &&
            (has(c.env) ? size(c.env) : 0) == {{ len (default dict (index $roles $role).environment) }}) &&
          (!has(object.spec.volumes) || object.spec.volumes.all(v,
            has(v.emptyDir) ||
            {{- range $mount := (index $roles $role).mounts }}
            {{- if $mount.claim }}
            (has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == {{ toJson $mount.claim }}) ||
            {{- else if $mount.secret }}
            (has(v.secret) && v.secret.secretName == {{ toJson $mount.secret }} &&
              has(v.secret.items) && size(v.secret.items) > 0 &&
              v.secret.items.all(i, i.key in {{ toJson $mount.keys }})) ||
            {{- end }}
            {{- end }}
            false)) &&
          object.spec.containers.all(c, !has(c.volumeMounts) || c.volumeMounts.all(m,
            !has(m.subPathExpr) && (!has(m.mountPropagation) || m.mountPropagation == 'None') &&
            object.spec.volumes.exists(v, v.name == m.name &&
              (has(v.emptyDir) ||
                {{- range $mount := (index $roles $role).mounts }}
                (
                  {{- if $mount.claim }}
                  has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == {{ toJson $mount.claim }} &&
                  {{- if $mount.subPathPattern }}
                  has(m.subPath) && !m.subPath.startsWith('/') &&
                  m.subPath.split('/').all(p, p != '..' && p != '.' && p != '') &&
                  m.subPath.matches({{ toJson $mount.subPathPattern }}) &&
                  {{- else }}
                  (!has(m.subPath) || m.subPath == '') &&
                  {{- end }}
                  {{- else if $mount.secret }}
                  has(v.secret) && v.secret.secretName == {{ toJson $mount.secret }} &&
                  {{- if $mount.subPath }}
                  has(m.subPath) && m.subPath == {{ toJson $mount.subPath }} &&
                  {{- else }}
                  !has(m.subPath) &&
                  {{- end }}
                  {{- end }}
                  m.mountPath.matches({{ toJson $mount.mountPathPattern }}) &&
                  {{- if $mount.readOnly }}
                  has(m.readOnly) && m.readOnly
                  {{- else }}
                  (!has(m.readOnly) || !m.readOnly)
                  {{- end }}
                ) ||
                {{- end }}
                false))))
        )
        {{- end }}
      message: The worker role, image or credential/storage mount is outside its administrator allowlist.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $policy }}
spec:
  policyName: {{ $policy }}
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        hermes.stack/sandbox: {{ .Values.sandbox.policyIdentity | quote }}
        kubernetes.io/metadata.name: {{ .Values.sandbox.namespace }}
    objectSelector: {}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $policy }}-delete
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [DELETE]
        resources: [pods]
  validations:
    - expression: >-
        request.userInfo.username != {{ toJson (printf "system:serviceaccount:%s:%s" .Release.Namespace .Values.sandbox.managerServiceAccount) }} ||
        (has(oldObject.metadata.labels) &&
          'app.kubernetes.io/managed-by' in oldObject.metadata.labels &&
          oldObject.metadata.labels['app.kubernetes.io/managed-by'] == 'agent-platform-runtime-manager' &&
          oldObject.metadata.name.matches('^hermes-exec-[0-9a-f]{24}-[0-9a-f]{12}$'))
      message: The execution manager may delete only managed worker Pods.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $policy }}-delete
spec:
  policyName: {{ $policy }}-delete
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        hermes.stack/sandbox: {{ .Values.sandbox.policyIdentity | quote }}
        kubernetes.io/metadata.name: {{ .Values.sandbox.namespace }}

{{- end }}
