{{- range $name, $claim := .Values.persistence }}
{{- if and $claim.enabled (not $claim.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "agent-platform.labels" $ | nindent 4 }}
spec:
  accessModes: {{ toYaml $claim.accessModes | nindent 4 }}
  {{- if hasKey $claim "storageClassName" }}
  storageClassName: {{ $claim.storageClassName | quote }}
  {{- end }}
  {{- with $claim.volumeName }}
  volumeName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $claim.size }}
{{- end }}
{{- end }}
