pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
events {}
http {
  access_log off;
  client_body_temp_path /run/nginx/client;
  proxy_temp_path /run/nginx/proxy;
  fastcgi_temp_path /run/nginx/fastcgi;
  uwsgi_temp_path /run/nginx/uwsgi;
  scgi_temp_path /run/nginx/scgi;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    client_max_body_size 25m;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    location = /healthz { proxy_pass http://multica-backend:8080/healthz; }
    location /api/ { proxy_pass http://multica-backend:8080; }
    location /auth/ { proxy_pass http://multica-backend:8080; }
    location /v1/ { proxy_pass http://multica-backend:8080; }
    location = /health { proxy_pass http://multica-backend:8080; }
    location /ws { proxy_pass http://multica-backend:8080; }
    location /uploads/ { proxy_pass http://multica-backend:8080; }
    location / { proxy_pass http://multica-web:3000; }
  }
}
