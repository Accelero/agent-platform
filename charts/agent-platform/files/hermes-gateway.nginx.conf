pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
events {}
http {
  access_log off;
  client_body_temp_path /run/nginx/client;
  proxy_temp_path /run/nginx/proxy;
  fastcgi_temp_path /run/nginx/fastcgi;
  uwsgi_temp_path /run/nginx/uwsgi;
  scgi_temp_path /run/nginx/scgi;
  server {
    listen 8080;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Multica is the single chat/task dispatcher in phase one. The dashboard
    # exposes settings and history without opening a second execution path.
    location = /auth/password-login {
      limit_except POST { deny all; }
      proxy_pass http://hermes:9119;
    }
    location = /api/config {
      limit_except GET POST PUT { deny all; }
      proxy_pass http://hermes:9119;
    }
    location / {
      limit_except GET { deny all; }
      proxy_set_header Upgrade '';
      proxy_set_header Connection '';
      proxy_pass http://hermes:9119;
    }
  }
}
