pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
events {}
http {
  access_log off;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  client_body_temp_path /run/nginx/client;
  proxy_temp_path /run/nginx/proxy;
  fastcgi_temp_path /run/nginx/fastcgi;
  uwsgi_temp_path /run/nginx/uwsgi;
  scgi_temp_path /run/nginx/scgi;
  server {
    listen 8080;
    client_max_body_size 64m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Native Hermes authenticates dashboard APIs and single-use WebSocket tickets.
    location / {
      proxy_pass http://hermes:9119;
    }
  }
}
