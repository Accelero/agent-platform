multica:
  publicUrl: https://multica.example.org
  ownerEmail: owner@example.org
  databaseUrl: postgres://multica:$(MULTICA_POSTGRES_PASSWORD)@agents-postgres-rw:5432/multica?sslmode=verify-full&sslrootcert=/etc/postgres/ca.crt
  databaseCASecret: agents-postgres-ca
  mailKeys:
  - SMTP_HOST
  - SMTP_FROM_EMAIL
hermes: {}
workloads:
  hermes:
    enabled: true
  runtime-manager:
    enabled: true
  multica-backend:
    enabled: true
  multica-web:
    enabled: true
  multica-gateway:
    enabled: true
  hermes-gateway:
    enabled: true
persistence:
  hermes-home:
    enabled: false
    existingClaim: hermes-home
  hermes-tasks:
    enabled: false
    existingClaim: hermes-tasks
  multica-uploads:
    enabled: false
    existingClaim: multica-uploads
  manager-state:
    enabled: false
    existingClaim: manager-state
sandbox:
  createNamespace: false
runtimeManager:
  authSecret: runtime-manager-auth
  tlsSecret: runtime-manager-tls
