[workspace]
members = ["crates/hermes-domain", "crates/hermes-application", "crates/hermes-adapters"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
hermes-domain = { path = "crates/hermes-domain" }
hermes-application = { path = "crates/hermes-application" }
async-trait = "=0.1.92"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "json", "migrate", "macros"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "time", "sync"] }
url = "=2.5.8"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
