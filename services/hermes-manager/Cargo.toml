[workspace]
members = ["crates/hermes-domain", "crates/hermes-application", "crates/hermes-adapters", "crates/hermes-manager", "crates/hermes-router-auth"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
hermes-domain = { path = "crates/hermes-domain" }
hermes-application = { path = "crates/hermes-application" }
async-trait = "=0.1.92"
axum = "=0.8.9"
base64 = "=0.22.1"
chacha20poly1305 = "=0.10.1"
getrandom = "=0.4.3"
hyper-util = { version = "=0.1.20", features = ["server-auto", "service", "tokio"] }
jsonwebtoken = { version = "=11.1.0", features = ["rust_crypto"] }
openidconnect = { version = "=4.0.1", default-features = false, features = ["timing-resistant-secret-traits"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "=2.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
subtle = "=2.6.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "json", "migrate", "macros"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "time", "sync", "net", "signal", "fs", "process", "io-util"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tempfile = "=3.27.0"
url = "=2.5.8"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
x509-parser = "=0.18.1"
zeroize = { version = "=1.9.1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
