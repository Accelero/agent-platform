[workspace]
members = [
    "crates/hermes-core",
    "crates/hermes-wire",
    "crates/hermes-store",
    "crates/hermes-render",
    "crates/hermes-kube",
    "crates/hermes-identity",
    "crates/hermes-native",
    "crates/hermes-http",
    "crates/hermes-proxy",
    "crates/hermes-manager",
    "crates/hermes-gateway",
    "crates/hermes-architecture",
    "crates/hermes-testkit",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
hermes-core = { path = "crates/hermes-core" }
hermes-wire = { path = "crates/hermes-wire" }
hermes-store = { path = "crates/hermes-store" }
hermes-render = { path = "crates/hermes-render" }
hermes-kube = { path = "crates/hermes-kube" }
hermes-identity = { path = "crates/hermes-identity" }
hermes-native = { path = "crates/hermes-native" }
hermes-http = { path = "crates/hermes-http" }
hermes-proxy = { path = "crates/hermes-proxy" }
hermes-testkit = { path = "crates/hermes-testkit" }
async-trait = "=0.1.92"
axum = "=0.8.9"
base64 = "=0.22.1"
chacha20poly1305 = "=0.10.1"
getrandom = "=0.4.3"
hmac = { version = "=0.13.0", features = ["zeroize"] }
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["server-auto", "service", "tokio"] }
jsonwebtoken = { version = "=11.1.0", features = ["rust_crypto"] }
k8s-openapi = { version = "=0.28.0", features = ["v1_36"] }
kube = { version = "=4.2.0", default-features = false, features = ["client", "rustls-tls", "ring"] }
openidconnect = { version = "=4.0.1", default-features = false, features = ["timing-resistant-secret-traits"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "form", "query"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "=2.2.0"
russh = { version = "=0.64.1", default-features = false, features = ["ring"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "json", "migrate", "macros"] }
subtle = "=2.6.1"
tempfile = "=3.27.0"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
x509-parser = "=0.18.1"
zeroize = { version = "=1.9.1", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
ssh-key = { version = "=0.6.7", default-features = false, features = ["std", "ed25519"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "time", "sync", "net", "signal", "fs", "process", "io-util"] }
url = "=2.5.8"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
