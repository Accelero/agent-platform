[project]
name = "agent-platform"
version = "0.6.1"
requires-python = ">=3.14"
dependencies = ["PyYAML==6.0.2"]

[dependency-groups]
dev = [
    "kubernetes==31.0.0",
    "openapi-spec-validator==0.7.2",
    "pytest>=9,<10",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.per-file-target-version]
"runtimes/**/*.py" = "py313"
"tests/personal_hermes/native_owner_payload.py" = "py313"
