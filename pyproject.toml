[project]
name = "agent-platform"
version = "0.6.3"
requires-python = ">=3.14"
dependencies = ["PyYAML==6.0.2"]

[dependency-groups]
dev = [
    "kubernetes==31.0.0",
    "pytest>=9,<10",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
