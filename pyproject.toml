[project]
name = "agent-platform"
version = "0.8.0"
requires-python = ">=3.14"
dependencies = ["PyYAML==6.0.2"]

[dependency-groups]
dev = [
    "kubernetes==31.0.0",
    "pytest>=9,<10",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "services/runtime-manager", "services/tools"]
# Every run includes `image` tests, which build and run real container images.
# Without Docker they skip locally and fail in CI, where `CI` is set.
addopts = "--strict-config --strict-markers"
markers = [
    "unit: in process, no socket, subprocess or container",
    "integration: a real protocol or process boundary (TLS, SQLite file, kubectl, helm)",
    "e2e: the whole execution chain without a cluster",
    "image: builds and runs a real container image (deselect locally with -m 'not image')",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
