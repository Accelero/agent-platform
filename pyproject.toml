[project]
name = "agent-platform"
version = "0.8.0"
requires-python = ">=3.14"
dependencies = ["PyYAML==6.0.2"]

[dependency-groups]
dev = [
    "kubernetes==31.0.0",
    "pytest>=9,<10",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
# Suites, levels, shards and markers: tests/support/suites.py and docs/testing.md.
testpaths = [
    "agent_platform/tests",
    "charts/tests",
    "services/runtime-manager/tests",
    "services/tools/tests",
    "services/multica/tests",
    "runtimes/hermes/tests",
    "runtimes/agent-runtime/tests",
    "tests/e2e",
]
pythonpath = [".", "services/runtime-manager", "services/tools"]
addopts = "--strict-config --strict-markers --import-mode=importlib"

[tool.ruff]
# Image sources keep their reviewed formatting; lint covers tooling and tests.
extend-exclude = [
    "vendor",
    "tools/platform",
    "runtimes/agent-runtime/multica-checkout-proxy.py",
    "runtimes/hermes/native_files.py",
    "runtimes/hermes/patch-terminal-scope.py",
    "runtimes/hermes/runtime-init.py",
    "runtimes/hermes/plugins",
    "services/runtime-manager/runtime_manager",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
