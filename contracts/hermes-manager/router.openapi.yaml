openapi: 3.1.0
info:
  title: Personal Hermes route resolution
  version: 0.1.0
  description: >-
    Internal API on the manager's resolver listener. hermes-gateway, identified
    by the URI SAN of its mTLS client certificate, asserts the identity it
    verified through its own OIDC session; the manager resolves it to that
    identity's enabled, ready instance. The API mutates nothing and grants
    nothing.
servers:
  - url: https://hermes-manager-resolver.internal.example.org
security:
  - GatewayMTLS: []
paths:
  /internal/v1/routes/resolve:
    post:
      operationId: resolvePersonalHermesRoute
      summary: Resolve an identity's registered destination
      description: >-
        Require the configured gateway client certificate identity. Resolve the
        exact issuer and subject against current PostgreSQL state with no
        positive decision cache. Complete within the caller's 2-second
        deadline. Bodies are limited to 16 KiB. Never log identities or bodies.
        All responses use no-store. The destination comes only from the
        instance registry; the gateway never dials anything else.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
            example:
              identity:
                issuer: https://sso.example.org/realms/agents
                subject: 00000000-0000-4000-8000-000000000001
      responses:
        '200':
          description: Enabled assignment with a ready instance
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyDecision'
              example:
                status: ready
                instanceId: 00000000-0000-4000-8000-000000000002
                routeGeneration: 1
                authorizationVersion: 1
                destination:
                  namespace: hi-7d6c0e1a0000-0b7d4c1e2a3f4e5d8c6b7a9f0e1d2c3b
                  service: hermes
                  port: 8080
                  scheme: http
        '202':
          description: The owner's instance is enabled but not ready; show the owner a status page
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingDecision'
        '403':
          description: The caller is not the gateway, or the identity has no enabled assignment
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeniedDecision'
        '422':
          description: Malformed or unsupported request; supplies no destination
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequest'
        '503':
          description: Dependency failure or unusable registry state; never a fallback destination
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnavailableDecision'
components:
  securitySchemes:
    GatewayMTLS:
      type: mutualTLS
      description: >-
        The configured gateway URI identity, not just its signing CA. A
        certificate of any other service cannot resolve routes.
  headers:
    NoStore:
      description: Do not cache routing or authorization responses
      schema:
        type: string
        const: no-store
  schemas:
    Identity:
      type: object
      additionalProperties: false
      required: [issuer, subject]
      properties:
        issuer:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          description: Exact case-sensitive configured OIDC issuer
        subject:
          type: string
          minLength: 1
          maxLength: 255
          description: Exact case-sensitive verified OIDC subject; never email
    ResolveRequest:
      type: object
      additionalProperties: false
      required: [identity]
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
    ReadyDecision:
      type: object
      additionalProperties: false
      required: [status, instanceId, routeGeneration, authorizationVersion, destination]
      properties:
        status:
          const: ready
        instanceId:
          type: string
          format: uuid
        routeGeneration:
          type: integer
          format: int64
          minimum: 1
          description: The instance's desired generation; a change ends cached decisions and open connections
        authorizationVersion:
          type: integer
          format: int64
          minimum: 1
          description: The assignment's version
        destination:
          $ref: '#/components/schemas/RegisteredDestination'
    RegisteredDestination:
      type: object
      additionalProperties: false
      required: [namespace, service, port, scheme]
      description: >-
        Read only from the commissioned instance registry. The gateway checks
        that the namespace has the installation's format before dialing
        `<service>.<namespace>.svc`.
      properties:
        namespace:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        service:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
        port:
          type: integer
          minimum: 1
          maximum: 65535
        scheme:
          type: string
          enum: [http, https]
    PendingDecision:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          const: pending
        reason:
          enum: [instance_not_ready, instance_blocked]
          description: '`instance_blocked`: the instance needs an administrator'
    DeniedDecision:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          const: denied
        reason:
          enum: [access_denied]
    UnavailableDecision:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          const: unavailable
        reason:
          enum: [dependency_unavailable, registry_unavailable]
    InvalidRequest:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          const: invalid_request
