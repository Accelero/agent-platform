      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Authorized, bounded and redacted manager inspection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateVersionDefinition'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/configuration-references/storage-classes:
    get:
      operationId: listApprovedStorageClasses
      parameters:
      - $ref: '#/components/parameters/ListSearch'
      - $ref: '#/components/parameters/ListSort'
      - $ref: '#/components/parameters/ListAfter'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Authorized, bounded and redacted manager inspection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageClassPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/terminal-runtimes/{id}:
    get:
      operationId: getTerminalRuntime
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          maxLength: 63
      responses:
        '200':
          description: Approved exact reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeDefinition'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/configuration-references/storage-bindings:
    get:
      operationId: listStorageBindingReferences
      parameters:
      - $ref: '#/components/parameters/ListSearch'
      - $ref: '#/components/parameters/ListSort'
      - $ref: '#/components/parameters/ListAfter'
      - $ref: '#/components/parameters/Limit'
      - name: instanceId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Approved exact reference.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - nextCursor
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/StorageBinding'
                  nextCursor:
                    $ref: '#/components/schemas/ListCursor'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/template-versions:
    get:
      operationId: listTemplateVersions
      description: Search and ID/version order with query-bound keyset cursors; legacy numeric-cursor endpoints remain
        available.
      parameters:
      - $ref: '#/components/parameters/ListSearch'
      - $ref: '#/components/parameters/ListSort'
      - $ref: '#/components/parameters/ListAfter'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/TemplateFilter'
      responses:
        '200':
          description: Bounded immutable versions.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - nextCursor
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/TemplateView'
                  nextCursor:
                    $ref: '#/components/schemas/ListCursor'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/terminal-runtimes/{id}/version-history:
    get:
      operationId: listRuntimeVersionHistory
      description: Search and ID/version order with query-bound keyset cursors; legacy numeric-cursor endpoints remain
        available.
      parameters:
      - $ref: '#/components/parameters/ListSearch'
      - $ref: '#/components/parameters/ListSort'
      - $ref: '#/components/parameters/ListAfter'
      - $ref: '#/components/parameters/Limit'
      - name: id
        in: path
        required: true
        schema:
          type: string
          maxLength: 63
      responses:
        '200':
          description: Bounded immutable versions.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - nextCursor
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/RuntimeDefinition'
                  nextCursor:
                    $ref: '#/components/schemas/ListCursor'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/assignments/{id}/template-observation:
    get:
      operationId: getAssignmentTemplateObservation
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Desired pin and last observed immutable operation snapshot; null means unobserved.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - desiredTemplate
                - observedTemplate
                - desiredGeneration
                - observedGeneration
                - state
                properties:
                  desiredTemplate:
                    $ref: '#/components/schemas/TemplateVersion'
                  observedTemplate:
                    anyOf:
                    - $ref: '#/components/schemas/TemplateVersion'
                    - type: 'null'
                  desiredGeneration:
                    type: integer
                  observedGeneration:
                    type: integer
                  state:
                    $ref: '#/components/schemas/InstanceState'
                  conditions:
                    type: object
                    additionalProperties:
                      type: string
                      enum:
                      - native_ready
                      - dependency_unavailable
                      - ownership_conflict
                      - initialization_uncertain
                      - policy_unavailable
                      - review_required
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/v1/directory-users:
    get:
      operationId: searchDirectoryUsers
      description: Read-only Keycloak identity candidates. Labels are descriptive; exact issuer/subject is authoritative. Results do not establish signed-login evidence or administrator grants. Provider-defined search/order and bounded offset cursors may shift when the directory changes.
      parameters:
      - $ref: '#/components/parameters/ListSearch'
      - $ref: '#/components/parameters/ListAfter'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Directory page, or enabled=false when unconfigured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectoryPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }

components:
  securitySchemes:
    AdministratorSession:
      type: apiKey
      in: cookie
      name: __Host-hermes-admin
      description: Opaque Secure/HttpOnly/SameSite=Lax cookie, bound to a separate opaque __Host-hermes-admin-browser proof cookie
    AdministratorAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Verified Keycloak access token; ID tokens are not accepted
  parameters:
    ListAfter:
      name: after
      in: query
      description: Opaque cursor bound to installation, endpoint, query, filters, sort and limit. Reusing with different parameters returns 422.
      schema: { type: string, maxLength: 2048 }
    ListSearch:
      name: q
      in: query
      description: Case-insensitive literal substring on issuer/subject (identities and assignments), action/actor subject (audit), or runtime ID/image. No wildcard syntax.
      schema: { type: string, maxLength: 128 }
    ListSort:
      name: sort
      in: query
      description: Stable identifier order; the unique ID is the ordering and tie-breaker. A leading minus reverses it.
      schema: { type: string, enum: [id, '-id'], default: id }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    After:
      name: after
      in: query
      required: false
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' }
      description: Exact actor/operation-scoped key; changed payload or If-Match conflicts
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      description: Strong version ETag from the assignment/instance response; no wildcard/weak/list form
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: Nonzero request UUID; generated server-side if absent
    SourceFilter:
      name: source
      in: query
      schema:
        type: string
        enum:
        - infrastructure
        - manager
    AssignedFilter:
      name: assigned
      in: query
      schema:
        type: boolean
    IdentityFilter:
      name: identityId
      in: query
      schema:
        type: string
        format: uuid
    RuntimeFilter:
      name: runtimeId
      in: query
      schema:
        type: string
        maxLength: 63
    RuntimeVersionFilter:
      name: runtimeVersion
      in: query
      schema:
        type: integer
        minimum: 1
    AssignmentFilter:
      name: assignmentId
      in: query
      schema:
        type: string
        format: uuid
    PublicationFilter:
      name: publication
      in: query
      schema:
        type: string
        enum:
        - draft
        - published
    AccessFilter:
      name: access
      in: query
      schema:
        type: string
        enum:
        - enabled
        - suspended
        - revoked
    StateFilter:
      name: state
      in: query
      schema:
        type: string
    TemplateFilter:
      name: templateId
      in: query
      schema:
        type: string
        maxLength: 63
  headers:
    ETag:
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      description: Strong optimistic assignment version
  responses:
    InvalidConfiguration:
      description: Bounded path-addressed configuration errors; messages never contain submitted values.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    Accepted:
      description: Mutation and pending work committed durably
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Accepted' }
    Unauthenticated:
      description: Missing, invalid, expired or incorrectly targeted access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Valid token without the configured management-client administrator role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Registered object not found in this installation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Existing assignment or changed input for an already used idempotency key
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    StaleVersion:
      description: If-Match is valid but no longer current; no mutation committed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidRequest:
      description: Malformed, missing required header, unknown field or unapproved configuration
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Dependency, maintenance or registry recovery gate denies the operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    DirectoryUser:
      type: object
      additionalProperties: false
      required: [identity, username, displayName, email, enabled, directoryVerified]
      properties:
        identity: { $ref: '#/components/schemas/Identity' }
        username: { type: [string, 'null'], maxLength: 320 }
        displayName: { type: [string, 'null'], maxLength: 641 }
        email: { type: [string, 'null'], maxLength: 320 }
        enabled: { type: boolean }
        directoryVerified: { type: boolean, const: true }
    DirectoryPage:
      type: object
      additionalProperties: false
      required: [enabled, items, nextCursor]
      properties:
        enabled: { type: boolean }
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/DirectoryUser' } }
        nextCursor: { $ref: '#/components/schemas/ListCursor' }
    AdministratorInput:
      type: object
      additionalProperties: false
      required: [identity, active, canManageAdministrators]
      properties:
        identity: { $ref: '#/components/schemas/Identity' }
        active: { type: boolean }
        canManageAdministrators: { type: boolean }
    AdministratorGrant:
      type: object
      additionalProperties: false
      required: [id, identity, active, canManageAdministrators, version, source]
      properties:
        id: { type: string, format: uuid }
        identity: { $ref: '#/components/schemas/Identity' }
        active: { type: boolean }
        canManageAdministrators: { type: boolean }
        version: { type: integer, minimum: 1 }
        source: { type: string, const: postgresql }
    AdministratorPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AdministratorGrant' } }
        nextCursor: { $ref: '#/components/schemas/ListCursor' }
    AdministratorCandidates:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        nextCursor: { $ref: '#/components/schemas/ListCursor' }
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Identity' } }
    AdministratorAccepted:
      type: object
      additionalProperties: false
      required: [id, version, operationId]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        operationId: { type: string, format: uuid }
    TemplateSelection:
      type: object
      additionalProperties: false
      required: [templateId, templateVersion]
      properties:
        templateId: { type: string, maxLength: 63 }
        templateVersion: { type: integer, minimum: 1 }
    TemplatePreview:
      type: object
      additionalProperties: false
      required: [assignmentId, expectedVersion, currentTemplate, proposedTemplate, currentDefinition, proposedDefinition, restart, eligible, blockedReasons]
      properties:
        assignmentId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1 }
        currentTemplate: { $ref: '#/components/schemas/TemplateVersion' }
        proposedTemplate: { $ref: '#/components/schemas/TemplateVersion' }
        currentDefinition: { anyOf: [{ $ref: '#/components/schemas/TemplateDefinition' }, { type: 'null' }] }
        proposedDefinition: { $ref: '#/components/schemas/TemplateDefinition' }
        restart: { type: boolean }
        eligible: { type: boolean }
        blockedReasons: { type: array, items: { type: string } }
    TemplateBatch:
      type: object
      additionalProperties: false
      required: [selection, members]
      properties:
        selection: { $ref: '#/components/schemas/TemplateSelection' }
        members:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [assignmentId, expectedVersion]
            properties:
              assignmentId: { type: string, format: uuid }
              expectedVersion: { type: integer, minimum: 1 }
    TemplateBatchPreview:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/TemplatePreview' } }
    TemplateBatchAccepted:
      type: object
      additionalProperties: false
      required: [id, operationId]
      properties:
        id: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
    TemplateBatchView:
      type: object
      additionalProperties: false
      required: [id, state, items, actor, selection]
      properties:
        actor: { $ref: '#/components/schemas/Identity' }
        selection: { $ref: '#/components/schemas/TemplateSelection' }
        id: { type: string, format: uuid }
        state: { type: string, enum: [Pending, Succeeded, Failed] }
        items:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [assignmentId, expectedVersion, state, operationId, errorCode]
            properties:
              assignmentId: { type: string, format: uuid }
              expectedVersion: { type: integer }
              state: { type: string, enum: [Pending, Accepted, Failed] }
              operationId: { type: [string, 'null'], format: uuid }
              errorCode: { type: [string, 'null'] }
    TemplateDraftInput:
      type: object
      additionalProperties: false
      required: [templateId, definition]
      properties:
        templateId: { type: string, maxLength: 63, pattern: '^[a-z][a-z0-9-]{0,62}$' }
        definition: { $ref: '#/components/schemas/TemplateDefinition' }
    TemplateDraft:
      type: object
      additionalProperties: false
      required: [id, templateId, definition, version, publishedVersion]
      properties:
        id: { type: string, format: uuid }
        templateId: { type: string }
        definition: { $ref: '#/components/schemas/TemplateDefinition' }
        version: { type: integer, minimum: 1 }
        publishedVersion: { type: [integer, 'null'], minimum: 1 }
    TemplateDraftAccepted:
      type: object
      additionalProperties: false
      required: [draft, operationId]
      properties:
        draft: { $ref: '#/components/schemas/TemplateDraft' }
        operationId: { type: string, format: uuid }
    ConfigurationProblem:
      type: object
      additionalProperties: false
      required: [pointer, code, severity, message]
      properties:
        pointer: { type: string, maxLength: 2048 }
        code: { type: string }
        severity: { type: string, enum: [error, warning] }
        message: { type: string }
    ValidationProblem:
      type: object
      additionalProperties: false
      required: [error, problems]
      properties:
        error: { type: string, const: invalid_configuration }
        problems: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/ConfigurationProblem' } }
    Identity:
      $ref: './router.openapi.yaml#/components/schemas/Identity'
    Access:
      type: string
      enum: [enabled, suspended, revoked]
    ListCursor:
      type: [string, 'null']
      maxLength: 2048
    Cursor:
      type: [string, 'null']
      format: uuid
    Session:
      type: object
      additionalProperties: false
      required: [actor, permittedActions, csrfToken]
      properties:
        actor: { $ref: '#/components/schemas/Identity' }
        permittedActions: { type: array, items: { type: string, enum: [administrator.manage, template.draft.create, template.draft.update, template.publish, assignment.set_template, assignment.create, assignment.set_access, instance.retry, execution.runtime.register, execution.storage.register, execution.storage.update, execution.pull-secret.register, execution.policy.set] } }
        csrfToken: { type: [string, 'null'], description: Null for bearer API-only authentication }
    CreateAssignment:
      type: object
      additionalProperties: false
      required: [identity, access, templateId]
      properties:
        identity: { $ref: '#/components/schemas/Identity' }
        access: { $ref: '#/components/schemas/Access' }
        templateId: { type: string, minLength: 1, maxLength: 63, pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$' }
        templateVersion: { type: integer, format: int64, minimum: 1 }
    TemplateVersion:
      type: object
      additionalProperties: false
      required: [id, version]
      properties:
        id: { type: string }
        version: { type: integer, format: int64, minimum: 1 }
    TemplateView:
      type: object
      additionalProperties: false
      required: [id, version, image, nativePort, nativeScheme]
      properties:
        id: { type: string }
        version: { type: integer, format: int64, minimum: 1 }
        image: { type: string, pattern: '^.+@sha256:[0-9a-f]{64}$' }
        nativePort: { type: integer, minimum: 1, maximum: 65535 }
        nativeScheme: { type: string, enum: [http, https] }
    TemplateDefinition:
      type: object
      additionalProperties: false
      required: [schemaVersion, image, storageClass, homeGib, workspaceGib, cpuMillis, memoryMib]
      properties:
        schemaVersion: { type: integer, const: 1 }
        image: { type: string, pattern: '^.+@sha256:[0-9a-f]{64}$' }
        storageClass: { type: string, maxLength: 63 }
        homeGib: { type: integer, minimum: 1, maximum: 1048576 }
        workspaceGib: { type: integer, minimum: 1, maximum: 1048576 }
        cpuMillis: { type: integer, minimum: 10, maximum: 64000 }
        memoryMib: { type: integer, minimum: 128, maximum: 262144 }
        adminConfig: { type: object, additionalProperties: true }
    TemplateDefinitionView:
      type: object
      additionalProperties: false
      required:
      - id
      - source
      - definition
      - condition
      - rejectedDefinition
      - versions
      - assignedUserCount
      - redactedPaths
      properties:
        id:
          type: string
        source:
          type: string
          enum:
          - infrastructure
          - manager
        definition:
          anyOf:
          - $ref: '#/components/schemas/TemplateDefinition'
          - type: 'null'
        condition:
          type:
          - string
          - 'null'
          enum:
          - invalid_definition
          - null
        rejectedDefinition:
          anyOf:
          - type: object
            additionalProperties: false
            required:
            - code
            properties:
              code:
                type: string
                const: invalid_definition
          - type: 'null'
        versions:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required:
            - version
            - digest
            properties:
              version:
                type: integer
                minimum: 1
              digest:
                type: string
                pattern: ^[a-f0-9]{64}$
        assignedUserCount:
          type: integer
          minimum: 0
        redactedPaths:
          type: array
          items:
            type: string
        publicationState:
          type: string
          enum:
          - published
          - pending
          - rejected
          - catalog_only
        schemaCoverage:
          type: string
          enum:
          - reviewed_keys
          - envelope_only
    IdentityView:
      type: object
      additionalProperties: false
      required:
      - id
      - identity
      - directoryVerified
      - provenance
      - assignment
      properties:
        id:
          type: string
          format: uuid
        identity:
          $ref: '#/components/schemas/Identity'
        directoryVerified:
          type: boolean
        provenance:
          type: string
          enum: [manager_record, verified_authentication]
        assignment:
          anyOf:
          - $ref: '#/components/schemas/Assignment'
          - type: 'null'
    Assignment:
      type: object
      additionalProperties: false
      required: [id, identity, access, template, version, instanceId, namespace, desiredGeneration, observedGeneration, state, source]
      properties:
        source: { type: string, enum: [infrastructure, manager] }
        id: { type: string, format: uuid }
        identity: { $ref: '#/components/schemas/Identity' }
        access: { $ref: '#/components/schemas/Access' }
        template: { $ref: '#/components/schemas/TemplateVersion' }
        version: { type: integer, format: int64, minimum: 1 }
        instanceId: { type: string, format: uuid }
        namespace: { type: string }
        desiredGeneration: { type: integer, format: int64, minimum: 1 }
        observedGeneration: { type: integer, format: int64, minimum: 0 }
        state: { $ref: '#/components/schemas/InstanceState' }
    InstanceState:
      type: string
      enum: [Pending, Provisioning, Ready, Blocked, Suspending, Suspended, Retained, Deleting, Deleted, Error]
    Instance:
      type: object
      additionalProperties: false
      required: [id, assignmentId, namespace, desiredGeneration, observedGeneration, state, version]
      properties:
        id: { type: string, format: uuid }
        assignmentId: { type: string, format: uuid }
        namespace: { type: string }
        desiredGeneration: { type: integer, format: int64, minimum: 1 }
        observedGeneration: { type: integer, format: int64, minimum: 0 }
        state: { $ref: '#/components/schemas/InstanceState' }
        version: { type: integer, format: int64, minimum: 1 }
    Accepted:
      type: object
      additionalProperties: false
      required: [assignmentId, instanceId, operationId, version]
      properties:
        assignmentId: { type: string, format: uuid }
        instanceId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 1 }
    Operation:
      type: object
      additionalProperties: false
      required: [id, instanceId, kind, generation, state, attempt, nextAttemptAt]
      properties:
        id: { type: string, format: uuid }
        instanceId: { type: [string, 'null'], format: uuid }
        kind: { type: string, enum: [commission, suspend, revoke, retry, template.publish, template.draft.save, assignment.set_template, batch.apply, administrator.grant, administrator.revoke, administrator.bootstrap, administrator.recover] }
        generation: { type: integer, format: int64, minimum: 1 }
        state: { type: string, enum: [Pending, Running, Waiting, RetryAt, Succeeded, Blocked, Failed, Superseded] }
        attempt: { type: integer, minimum: 0 }
        nextAttemptAt: { type: integer, format: int64, description: Database-time Unix seconds }
    AuditEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - actor
      - action
      - assignmentId
      - operationId
      - requestId
      - version
      - occurredAt
      - outcome
      properties:
        id:
          type: string
          format: uuid
        actor:
          $ref: '#/components/schemas/Identity'
        entityType:
          type:
          - string
          - 'null'
        entityId:
          type:
          - string
          - 'null'
        action:
          type: string
        assignmentId:
          type:
          - string
          - 'null'
          format: uuid
        operationId:
          type:
          - string
          - 'null'
          format: uuid
        requestId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 1
        occurredAt:
          type: integer
          format: int64
          description: Database-time Unix seconds
        outcome:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [administrator_grant_exists, identity_not_verified, last_administrator, ownership_conflict, storage_migration_required, invalid_request, invalid_identity_evidence, access_denied, idempotency_conflict, assignment_exists, not_found, stale_version, template_unavailable, maintenance, registry_unavailable, dependency_unavailable]
    RuntimeRef:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z][a-z0-9-]{0,62}$
        version:
          type: integer
          format: int64
          minimum: 1
    WorkerResources:
      type: object
      additionalProperties: false
      required:
      - cpuMillis
      - memoryMib
      - ephemeralStorageMib
      properties:
        cpuMillis:
          type: integer
          format: int64
          minimum: 10
          maximum: 64000
        memoryMib:
          type: integer
          format: int64
          minimum: 64
          maximum: 262144
        ephemeralStorageMib:
          type: integer
          format: int64
          minimum: 64
          maximum: 1048576
    ServiceEgress:
      type: object
      additionalProperties: false
      required:
      - namespace
      - service
      - port
      properties:
        namespace:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z][a-z0-9-]{0,62}$
        service:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z][a-z0-9-]{0,62}$
        port:
          type: integer
          format: int64
          minimum: 1
          maximum: 65535
    RuntimeDefinition:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - runtime
      - image
      - sshContract
      - uid
      - gid
      - serviceAccount
      - resources
      - locale
      - egress
      - pullSecretNames
      properties:
        schemaVersion:
          type: integer
          const: 1
        runtime:
          $ref: '#/components/schemas/RuntimeRef'
        image:
          type: string
          pattern: ^.+@sha256:[0-9a-f]{64}$
        sshContract:
          type: string
          enum: [managed-ssh-v1, managed-ssh-v2]
        uid:
          type: integer
          format: int64
          minimum: 1
          maximum: 65535
        gid:
          type: integer
          format: int64
          minimum: 1
          maximum: 65535
        serviceAccount:
          type: string
          const: worker
        resources:
          $ref: '#/components/schemas/WorkerResources'
        locale:
          type: string
          enum:
          - C.UTF-8
          - en_US.UTF-8
        egress:
          type: array
          maxItems: 16
          minItems: 0
          items:
            $ref: '#/components/schemas/ServiceEgress'
        pullSecretNames:
          type: array
          maxItems: 4
          minItems: 0
          items:
            type: string
            minLength: 1
            maxLength: 63
            pattern: ^[a-z][a-z0-9-]{0,62}$
          uniqueItems: true
    PermittedMount:
      type: object
      additionalProperties: false
      required:
      - path
      - readOnly
      properties:
        path:
          type: string
          description: Absolute approved container mount path; no reserved platform paths
            or overlaps.
        readOnly:
          type: boolean
        subPath:
          type:
          - string
          - 'null'
          description: Optional confined relative subpath; no dot, parent, absolute or
            backslash components.
    StorageBinding:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - instanceId
      - namespace
      - namespaceUid
      - pvcName
      - pvcUid
      - backingStorageId
      - external
      - required
      - backup
      - mounts
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 1
        instanceId:
          type: string
          format: uuid
        namespace:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z][a-z0-9-]{0,62}$
        namespaceUid:
          type: string
          minLength: 1
          maxLength: 128
        pvcName:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z][a-z0-9-]{0,62}$
        pvcUid:
          type: string
          minLength: 1
          maxLength: 128
        backingStorageId:
          type: string
          format: uuid
          description: Opaque inventory ID; never a filesystem/server path.
        external:
          type: boolean
        required:
          type: boolean
        backup:
          type: string
          enum:
          - platform_checkpoint
          - external
          - excluded
        mounts:
          type: array
          maxItems: 16
          minItems: 1
          items:
            $ref: '#/components/schemas/PermittedMount'
    PullSecretBinding:
      type: object
      additionalProperties: false
      required:
      - instanceId
      - namespace
      - namespaceUid
      - name
      - uid
      properties:
        instanceId:
          type: string
          format: uuid
        namespace:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z][a-z0-9-]{0,62}$
        namespaceUid:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z][a-z0-9-]{0,62}$
        uid:
          type: string
          minLength: 1
          maxLength: 128
    MountSelection:
      type: object
      additionalProperties: false
      required:
      - bindingId
      - bindingVersion
      - mount
      properties:
        bindingId:
          type: string
          format: uuid
        bindingVersion:
          type: integer
          format: int64
          minimum: 1
        mount:
          $ref: '#/components/schemas/PermittedMount'
    AllowedRuntime:
      type: object
      additionalProperties: false
      required:
      - runtime
      - resources
      - mounts
      properties:
        limits:
          $ref: '#/components/schemas/ExecutionLimits'
        runtime:
          $ref: '#/components/schemas/RuntimeRef'
        resources:
          $ref: '#/components/schemas/WorkerResources'
        mounts:
          type: array
          maxItems: 16
          minItems: 0
          items:
            $ref: '#/components/schemas/MountSelection'
    AssignmentExecution:
      type: object
      additionalProperties: false
      required:
      - defaultRuntimeId
      - allowed
      properties:
        defaultRuntimeId:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z][a-z0-9-]{0,62}$
        allowed:
          type: array
          maxItems: 16
          minItems: 1
          items:
            $ref: '#/components/schemas/AllowedRuntime'
    ResolvedMount:
      type: object
      additionalProperties: false
      required:
      - binding
      - mount
      properties:
        binding:
          $ref: '#/components/schemas/StorageBinding'
        mount:
          $ref: '#/components/schemas/PermittedMount'
    ResolvedRuntime:
      type: object
      additionalProperties: false
      required:
      - definition
      - definitionDigest
      - resources
      - mounts
      - pullSecrets
      properties:
        limits:
          $ref: '#/components/schemas/ExecutionLimits'
        definition:
          $ref: '#/components/schemas/RuntimeDefinition'
        definitionDigest:
          type: string
          pattern: ^[a-f0-9]{64}$
        resources:
          $ref: '#/components/schemas/WorkerResources'
        mounts:
          type: array
          maxItems: 16
          minItems: 0
          items:
            $ref: '#/components/schemas/ResolvedMount'
        pullSecrets:
          type: array
          maxItems: 4
          minItems: 0
          items:
            $ref: '#/components/schemas/PullSecretBinding'
    ResolvedPolicy:
      type: object
      additionalProperties: false
      required:
      - installationId
      - instanceId
      - namespace
      - namespaceUid
      - generation
      - defaultRuntimeId
      - runtimes
      properties:
        installationId:
          type: string
          format: uuid
        instanceId:
          type: string
          format: uuid
        namespace:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z][a-z0-9-]{0,62}$
        namespaceUid:
          type: string
          minLength: 1
          maxLength: 128
        generation:
          type: integer
          format: int64
          minimum: 1
        defaultRuntimeId:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z][a-z0-9-]{0,62}$
        runtimes:
          type: array
          maxItems: 16
          minItems: 1
          items:
            $ref: '#/components/schemas/ResolvedRuntime'
    ExecutionPolicyView:
      type: object
      additionalProperties: false
      required:
      - assignmentId
      - assignmentVersion
      - desiredGeneration
      - appliedGeneration
      - state
      - desired
      - digest
      properties:
        assignmentId:
          type: string
          format: uuid
        assignmentVersion:
          type: integer
          format: int64
          minimum: 1
        desiredGeneration:
          type: integer
          format: int64
          minimum: 1
        appliedGeneration:
          type: integer
          format: int64
          minimum: 0
        state:
          type: string
          enum:
          - Pending
          - Reconciling
          - Waiting
          - Applied
        desired:
          $ref: '#/components/schemas/ResolvedPolicy'
        applied:
          description: Immutable snapshot at appliedGeneration; null until trusted activation.
          anyOf:
          - $ref: '#/components/schemas/ResolvedPolicy'
          - type: 'null'
        digest:
          type: string
          pattern: ^[a-f0-9]{64}$
    ExecutionAccepted:
      type: object
      additionalProperties: false
      required:
      - eventId
      - assignmentVersion
      - policyGeneration
      - policyDigest
      properties:
        eventId:
          type: string
          format: uuid
        assignmentVersion:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
        policyGeneration:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
        policyDigest:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{64}$
    ExecutionLimits:
      type: object
      additionalProperties: false
      description: Optional policy limits; omitting the object selects these defaults.
      required: [ttlSeconds, exclusive, serializeProfile, maxEnvironments, maxLeases, idleSeconds]
      properties:
        ttlSeconds: { type: integer, minimum: 30, maximum: 600, default: 120 }
        exclusive: { type: boolean, default: false }
        serializeProfile: { type: boolean, default: false }
        maxEnvironments: { type: integer, minimum: 1, maximum: 64, default: 8 }
        maxLeases: { type: integer, minimum: 1, maximum: 128, default: 32 }
        idleSeconds: { type: integer, minimum: 30, maximum: 86400, default: 900 }
    OperationPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Operation'
        nextCursor:
          $ref: '#/components/schemas/ListCursor'
    OperationDetails:
      type: object
      additionalProperties: false
      required:
      - operation
      - assignmentId
      - steps
      properties:
        operation:
          $ref: '#/components/schemas/Operation'
        assignmentId:
          type:
          - string
          - 'null'
          format: uuid
        steps:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
            - key
            - recordedAt
            - verifiedAt
            properties:
              key:
                type: string
              recordedAt:
                type: integer
              verifiedAt:
                type:
                - integer
                - 'null'
    AuditDetails:
      type: object
      additionalProperties: false
      required:
      - event
      - redacted
      - change
      properties:
        event:
          $ref: '#/components/schemas/AuditEvent'
        redacted:
          type: boolean
          const: true
        change:
          type: object
          additionalProperties: false
          properties:
            access:
              $ref: '#/components/schemas/Access'
            templateId:
              type: string
            templateVersion:
              type: integer
            runtimeId:
              type: string
            version:
              type: integer
            storageBindingId:
              type: string
            instanceId:
              type: string
            assignmentId:
              type: string
            generation:
              type: integer
            digest:
              type: string
            pullSecretName:
              type: string
    TemplateVersionDefinition:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - digest
      - definition
      - redactedPaths
      properties:
        id:
          type: string
        version:
          type: integer
          minimum: 1
        digest:
          type: string
        definition:
          $ref: '#/components/schemas/TemplateDefinition'
        redactedPaths:
          type: array
          items:
            type: string
    StorageClassPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - source
            properties:
              id:
                type: string
              source:
                type: string
                const: approved_template
        nextCursor:
          $ref: '#/components/schemas/ListCursor'
