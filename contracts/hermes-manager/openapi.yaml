openapi: 3.1.0
info:
  title: Personal Hermes manager administration API
  version: 0.1.0
  description: >-
    Versioned administration boundary under development, not part of release
    0.6.1. The API authenticates Keycloak access
    tokens for the configured management audience, authorized client and
    management-client administrator role. Personal assignments, realm membership,
    service certificates and asserted headers grant no administrator permission.
    Require a signed Keycloak user-session sid; client-credentials tokens are
    unsupported. Management/router OIDC clients must disable service accounts.
    Optional browser OIDC sessions use S256 PKCE, server-side encrypted tokens,
    opaque host-only HttpOnly cookies and the same API. Cookie mutations require
    the exact administration Origin and X-CSRF-Token from GET /api/v1/session.
    Do not combine cookie and bearer credentials. UI serving is still pending.
    Every response is no-store. Request bodies and headers are each limited to
    16 KiB. Unknown or duplicate JSON/query fields are rejected. Mutations commit
    desired state or immutable approved references, actor-scoped idempotency and
    audit before returning 202. Assignment lifecycle commands also commit an
    operation; execution policy changes preserve desired/applied generations. Native
    files, histories, provider credentials and arbitrary Kubernetes specs are
    absent from this contract. Resolver requests use the separate router contract
    and mTLS listener; execution credentials cannot call this API.
servers:
  - url: https://hermes-admin.example.org
security:
  - AdministratorAccessToken: []
  - AdministratorSession: []
paths:
  /auth/login:
    get:
      operationId: beginAdministratorLogin
      security: []
      parameters:
        - name: returnTo
          in: query
          schema: { type: string, maxLength: 2048, default: '/' }
          description: Local UI path only; auth, API and platform paths are rejected
      responses:
        '303':
          description: Committed single-use PKCE/state flow, then provider redirect; previous browser sessions invalidated
          headers:
            Location: { schema: { type: string, format: uri } }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /auth/oidc/callback:
    get:
      operationId: completeAdministratorLogin
      security: []
      description: Browser proof and current single-use state required; codes and provider errors are never reflected
      parameters:
        - { name: state, in: query, required: true, schema: { type: string, maxLength: 128 } }
        - { name: code, in: query, schema: { type: string, maxLength: 4096 } }
        - { name: iss, in: query, schema: { type: string } }
        - { name: session_state, in: query, schema: { type: string, maxLength: 1024 } }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
      responses:
        '303':
          description: Committed opaque administrator session, then local UI redirect
          headers:
            Location: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /auth/logout:
    post:
      operationId: logoutAdministrator
      security:
        - AdministratorSession: []
      description: Exact Origin and session CSRF required; durable session revocation precedes best-effort provider token revocation
      parameters:
        - { name: Origin, in: header, required: true, schema: { type: string, format: uri } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
      responses:
        '204': { description: Session revoked and browser cookies expired }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/session:
    get:
      operationId: getAdministrationSession
      responses:
        '200':
          description: Verified human administrator and permitted actions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/identities:
    get:
      operationId: listIdentities
      description: >-
        Exact registered subjects. Directory verification is false unless a
        configured read-only directory adapter has verified the subject.
        Email never selects, links or transfers an assignment.
      parameters:
        - { $ref: '#/components/parameters/After' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Bounded registered-identity page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor]
                properties:
                  items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/IdentityView' } }
                  nextCursor: { $ref: '#/components/schemas/Cursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/templates:
    get:
      operationId: listInstanceTemplates
      responses:
        '200':
          description: Approved immutable template versions, without manifests or secrets
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor]
                properties:
                  items: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/TemplateView' } }
                  nextCursor: { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/assignments:
    get:
      operationId: listAssignments
      parameters:
        - { $ref: '#/components/parameters/After' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Bounded assignment page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor]
                properties:
                  items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Assignment' } }
                  nextCursor: { $ref: '#/components/schemas/Cursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: createAssignment
      description: >-
        Explicit administrator action. Enabling enqueues proactive commissioning;
        authentication alone cannot enroll. If templateVersion is omitted, pin
        the latest approved compatible version in the mutation transaction.
        Replay returns that original pinned result even if the catalog changes.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/RequestId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAssignment' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/assignments/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: getAssignment
      responses:
        '200':
          description: Current assignment, with a strong version ETag
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    patch:
      operationId: setAssignmentAccess
      description: >-
        Identity and instance IDs are immutable. Suspension/revocation deny
        routing from committed access immediately, fence earlier work, and
        retain data. Purge is a separate lifecycle command.
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/RequestId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [access]
              properties:
                access: { $ref: '#/components/schemas/Access' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/StaleVersion' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/instances/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: getInstance
      responses:
        '200':
          description: Instance metadata without native content or credentials
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instance' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/instances/{id}/reconcile:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      operationId: retryInstanceReconciliation
      description: >-
        Audited bounded retry under current desired access. It cannot enable a
        suspended/revoked owner, replace ownership, or accept manifests.
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/RequestId' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/StaleVersion' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/operations/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: getOperation
      responses:
        '200':
          description: Durable lifecycle progress, without external response bodies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      parameters:
        - { $ref: '#/components/parameters/After' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Immutable actor-attributed audit, without credentials
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor]
                properties:
                  items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AuditEvent' } }
                  nextCursor: { $ref: '#/components/schemas/Cursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/terminal-runtimes:
    get:
      operationId: listTerminalRuntimes
      description: Bounded latest approved definition for each runtime ID, ordered by
        ID.
      responses:
        '200':
          description: Bounded latest approved definition for each runtime ID, ordered
            by ID.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - nextCursor
                properties:
                  items:
                    type: array
                    maxItems: 100
                    minItems: 0
                    items:
                      $ref: '#/components/schemas/RuntimeDefinition'
                  nextCursor:
                    type:
                    - string
                    - 'null'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '412':
          $ref: '#/components/responses/StaleVersion'
      parameters:
      - name: after
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z][a-z0-9-]{0,62}$
      - $ref: '#/components/parameters/Limit'
    post:
      operationId: registerTerminalRuntime
      description: Register an immutable approved runtime image and bounded worker policy;
        no raw Pod specs or credential values.
      responses:
        '202':
          description: Register an immutable approved runtime image and bounded worker
            policy; no raw Pod specs or credential values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '412':
          $ref: '#/components/responses/StaleVersion'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeDefinition'
  /api/v1/terminal-runtimes/{id}/versions:
    get:
      operationId: listTerminalRuntimeVersions
      description: Immutable approved versions ordered by version. after is exclusive.
      responses:
        '200':
          description: Immutable approved versions ordered by version. after is exclusive.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - nextCursor
                properties:
                  items:
                    type: array
                    maxItems: 100
                    minItems: 0
                    items:
                      $ref: '#/components/schemas/RuntimeDefinition'
                  nextCursor:
                    type:
                    - integer
                    - 'null'
                    format: int64
                    minimum: 1
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '412':
          $ref: '#/components/responses/StaleVersion'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z][a-z0-9-]{0,62}$
      - name: after
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
        description: Exclusive version cursor, default 0
      - $ref: '#/components/parameters/Limit'
    post:
      operationId: registerTerminalRuntimeVersion
      description: Register immutable version; runtime.id in the body must equal the
        path ID.
      responses:
        '202':
          description: Register immutable version; runtime.id in the body must equal
            the path ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '412':
          $ref: '#/components/responses/StaleVersion'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z][a-z0-9-]{0,62}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeDefinition'
  /api/v1/storage-bindings:
    get:
      operationId: listOwnerStorageBindings
      description: Latest binding versions for exactly one registered instance namespace
        and UID. No inline storage or credential material.
      responses:
        '200':
          description: Latest binding versions for exactly one registered instance namespace
            and UID. No inline storage or credential material.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - nextCursor
                properties:
                  items:
                    type: array
                    maxItems: 100
                    minItems: 0
                    items:
                      $ref: '#/components/schemas/StorageBinding'
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    format: uuid
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '412':
          $ref: '#/components/responses/StaleVersion'
      parameters:
      - name: instanceId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/After'
      - $ref: '#/components/parameters/Limit'
    post:
      operationId: registerOwnerStorageBinding
      description: Register version 1 of an owner-bound existing PVC reference. Namespace
        name and UID must match the immutable instance owner.
      responses:
        '202':
          description: Register version 1 of an owner-bound existing PVC reference.
            Namespace name and UID must match the immutable instance owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionAccepted'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '412':
          $ref: '#/components/responses/StaleVersion'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageBinding'
  /api/v1/storage-bindings/{id}:
    get:
      operationId: getOwnerStorageBinding
      description: Latest registered immutable binding version.
      responses:
        '200':
          description: Latest registered immutable binding version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageBinding'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '412':
          $ref: '#/components/responses/StaleVersion'
      parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: updateOwnerStorageBinding
      description: Append the next immutable binding version. The ID and owner cannot
        change; body.version must equal If-Match plus one. Existing desired policy remains
        pinned until a separate policy update.
      responses:
        '202':
          description: Append the next immutable binding version. The ID and owner cannot
            change; body.version must equal If-Match plus one. Existing desired policy
            remains pinned until a separate policy update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionAccepted'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '412':
          $ref: '#/components/responses/StaleVersion'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageBinding'
  /api/v1/assignments/{id}/execution:
    get:
      operationId: getAssignmentExecution
      description: Inspect desired resolved policy and independently applied generation.
        Returns 404 before any policy exists; appliedGeneration remains zero until trusted
        activation.
      responses:
        '200':
          description: Inspect desired resolved policy and independently applied generation.
            Returns 404 before any policy exists; appliedGeneration remains zero until
            trusted activation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionPolicyView'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '412':
          $ref: '#/components/responses/StaleVersion'
      parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: setAssignmentExecution
      description: Commit a new desired policy using approved immutable runtime and
        owner storage references. If-Match is the current assignment version. This does
        not activate workers or publish readiness.
      responses:
        '202':
          description: Commit a new desired policy using approved immutable runtime
            and owner storage references. If-Match is the current assignment version.
            This does not activate workers or publish readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionAccepted'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '412':
          $ref: '#/components/responses/StaleVersion'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentExecution'
  /api/v1/instances/{id}/pull-secret-bindings:
    post:
      operationId: registerOwnerPullSecretBinding
      description: Register an existing owner-namespace Secret name and UID, never credential
        values. Body instanceId must equal the path ID.
      responses:
        '202':
          description: Register an existing owner-namespace Secret name and UID, never
            credential values. Body instanceId must equal the path ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '412':
          $ref: '#/components/responses/StaleVersion'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PullSecretBinding'
components:
  securitySchemes:
    AdministratorSession:
      type: apiKey
      in: cookie
      name: __Host-hermes-admin
      description: Opaque Secure/HttpOnly/SameSite=Lax cookie, bound to a separate opaque __Host-hermes-admin-browser proof cookie
    AdministratorAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Verified Keycloak access token; ID tokens are not accepted
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    After:
      name: after
      in: query
      required: false
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' }
      description: Exact actor/operation-scoped key; changed payload or If-Match conflicts
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      description: Strong version ETag from the assignment/instance response; no wildcard/weak/list form
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: Nonzero request UUID; generated server-side if absent
  headers:
    ETag:
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      description: Strong optimistic assignment version
  responses:
    Accepted:
      description: Mutation and pending work committed durably
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Accepted' }
    Unauthenticated:
      description: Missing, invalid, expired or incorrectly targeted access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Valid token without the configured management-client administrator role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Registered object not found in this installation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Existing assignment or changed input for an already used idempotency key
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    StaleVersion:
      description: If-Match is valid but no longer current; no mutation committed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidRequest:
      description: Malformed, missing required header, unknown field or unapproved configuration
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Dependency, maintenance or registry recovery gate denies the operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Identity:
      $ref: './router.openapi.yaml#/components/schemas/Identity'
    Access:
      type: string
      enum: [enabled, suspended, revoked]
    Cursor:
      type: [string, 'null']
      format: uuid
    Session:
      type: object
      additionalProperties: false
      required: [actor, permittedActions, csrfToken]
      properties:
        actor: { $ref: '#/components/schemas/Identity' }
        permittedActions: { type: array, items: { type: string, enum: [assignment.create, assignment.set_access, instance.retry, execution.runtime.register, execution.storage.register, execution.storage.update, execution.pull-secret.register, execution.policy.set] } }
        csrfToken: { type: [string, 'null'], description: Null for bearer API-only authentication }
    CreateAssignment:
      type: object
      additionalProperties: false
      required: [identity, access, templateId]
      properties:
        identity: { $ref: '#/components/schemas/Identity' }
        access: { $ref: '#/components/schemas/Access' }
        templateId: { type: string, minLength: 1, maxLength: 63, pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$' }
        templateVersion: { type: integer, format: int64, minimum: 1 }
    TemplateVersion:
      type: object
      additionalProperties: false
      required: [id, version]
      properties:
        id: { type: string }
        version: { type: integer, format: int64, minimum: 1 }
    TemplateView:
      type: object
      additionalProperties: false
      required: [id, version, image, nativePort, nativeScheme]
      properties:
        id: { type: string }
        version: { type: integer, format: int64, minimum: 1 }
        image: { type: string, pattern: '^.+@sha256:[0-9a-f]{64}$' }
        nativePort: { type: integer, minimum: 1, maximum: 65535 }
        nativeScheme: { type: string, enum: [http, https] }
    IdentityView:
      type: object
      additionalProperties: false
      required: [id, identity, directoryVerified]
      properties:
        id: { type: string, format: uuid }
        identity: { $ref: '#/components/schemas/Identity' }
        directoryVerified: { type: boolean }
    Assignment:
      type: object
      additionalProperties: false
      required: [id, identity, access, template, version, instanceId, namespace, desiredGeneration, observedGeneration, state]
      properties:
        id: { type: string, format: uuid }
        identity: { $ref: '#/components/schemas/Identity' }
        access: { $ref: '#/components/schemas/Access' }
        template: { $ref: '#/components/schemas/TemplateVersion' }
        version: { type: integer, format: int64, minimum: 1 }
        instanceId: { type: string, format: uuid }
        namespace: { type: string }
        desiredGeneration: { type: integer, format: int64, minimum: 1 }
        observedGeneration: { type: integer, format: int64, minimum: 0 }
        state: { $ref: '#/components/schemas/InstanceState' }
    InstanceState:
      type: string
      enum: [Pending, Provisioning, Ready, Blocked, Suspending, Suspended, Retained, Deleting, Deleted, Error]
    Instance:
      type: object
      additionalProperties: false
      required: [id, assignmentId, namespace, desiredGeneration, observedGeneration, state, version]
      properties:
        id: { type: string, format: uuid }
        assignmentId: { type: string, format: uuid }
        namespace: { type: string }
        desiredGeneration: { type: integer, format: int64, minimum: 1 }
        observedGeneration: { type: integer, format: int64, minimum: 0 }
        state: { $ref: '#/components/schemas/InstanceState' }
        version: { type: integer, format: int64, minimum: 1 }
    Accepted:
      type: object
      additionalProperties: false
      required: [assignmentId, instanceId, operationId, version]
      properties:
        assignmentId: { type: string, format: uuid }
        instanceId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 1 }
    Operation:
      type: object
      additionalProperties: false
      required: [id, instanceId, kind, generation, state, attempt, nextAttemptAt]
      properties:
        id: { type: string, format: uuid }
        instanceId: { type: string, format: uuid }
        kind: { type: string, enum: [commission, suspend, revoke, retry] }
        generation: { type: integer, format: int64, minimum: 1 }
        state: { type: string, enum: [Pending, Running, Waiting, RetryAt, Succeeded, Blocked, Failed, Superseded] }
        attempt: { type: integer, minimum: 0 }
        nextAttemptAt: { type: integer, format: int64, description: Database-time Unix seconds }
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, actor, action, assignmentId, operationId, requestId, version, occurredAt]
      properties:
        id: { type: string, format: uuid }
        actor: { $ref: '#/components/schemas/Identity' }
        action: { type: string }
        assignmentId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 1 }
        occurredAt: { type: integer, format: int64, description: Database-time Unix seconds }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_identity_evidence, access_denied, idempotency_conflict, assignment_exists, not_found, stale_version, template_unavailable, maintenance, registry_unavailable, dependency_unavailable]
    RuntimeRef:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z][a-z0-9-]{0,62}$
        version:
          type: integer
          format: int64
          minimum: 1
    WorkerResources:
      type: object
      additionalProperties: false
      required:
      - cpuMillis
      - memoryMib
      - ephemeralStorageMib
      properties:
        cpuMillis:
          type: integer
          format: int64
          minimum: 10
          maximum: 64000
        memoryMib:
          type: integer
          format: int64
          minimum: 64
          maximum: 262144
        ephemeralStorageMib:
          type: integer
          format: int64
          minimum: 64
          maximum: 1048576
    ServiceEgress:
      type: object
      additionalProperties: false
      required:
      - namespace
      - service
      - port
      properties:
        namespace:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z][a-z0-9-]{0,62}$
        service:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z][a-z0-9-]{0,62}$
        port:
          type: integer
          format: int64
          minimum: 1
          maximum: 65535
    RuntimeDefinition:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - runtime
      - image
      - sshContract
      - uid
      - gid
      - serviceAccount
      - resources
      - locale
      - egress
      - pullSecretNames
      properties:
        schemaVersion:
          type: integer
          const: 1
        runtime:
          $ref: '#/components/schemas/RuntimeRef'
        image:
          type: string
          pattern: ^.+@sha256:[0-9a-f]{64}$
        sshContract:
          type: string
          enum: [managed-ssh-v1, managed-ssh-v2]
        uid:
          type: integer
          format: int64
          minimum: 1
          maximum: 65535
        gid:
          type: integer
          format: int64
          minimum: 1
          maximum: 65535
        serviceAccount:
          type: string
          const: worker
        resources:
          $ref: '#/components/schemas/WorkerResources'
        locale:
          type: string
          enum:
          - C.UTF-8
          - en_US.UTF-8
        egress:
          type: array
          maxItems: 16
          minItems: 0
          items:
            $ref: '#/components/schemas/ServiceEgress'
        pullSecretNames:
          type: array
          maxItems: 4
          minItems: 0
          items:
            type: string
            minLength: 1
            maxLength: 63
            pattern: ^[a-z][a-z0-9-]{0,62}$
          uniqueItems: true
    PermittedMount:
      type: object
      additionalProperties: false
      required:
      - path
      - readOnly
      properties:
        path:
          type: string
          description: Absolute approved container mount path; no reserved platform paths
            or overlaps.
        readOnly:
          type: boolean
        subPath:
          type:
          - string
          - 'null'
          description: Optional confined relative subpath; no dot, parent, absolute or
            backslash components.
    StorageBinding:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - instanceId
      - namespace
      - namespaceUid
      - pvcName
      - pvcUid
      - backingStorageId
      - external
      - required
      - backup
      - mounts
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 1
        instanceId:
          type: string
          format: uuid
        namespace:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z][a-z0-9-]{0,62}$
        namespaceUid:
          type: string
          minLength: 1
          maxLength: 128
        pvcName:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z][a-z0-9-]{0,62}$
        pvcUid:
          type: string
          minLength: 1
          maxLength: 128
        backingStorageId:
          type: string
          format: uuid
          description: Opaque inventory ID; never a filesystem/server path.
        external:
          type: boolean
        required:
          type: boolean
        backup:
          type: string
          enum:
          - platform_checkpoint
          - external
          - excluded
        mounts:
          type: array
          maxItems: 16
          minItems: 1
          items:
            $ref: '#/components/schemas/PermittedMount'
    PullSecretBinding:
      type: object
      additionalProperties: false
      required:
      - instanceId
      - namespace
      - namespaceUid
      - name
      - uid
      properties:
        instanceId:
          type: string
          format: uuid
        namespace:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z][a-z0-9-]{0,62}$
        namespaceUid:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z][a-z0-9-]{0,62}$
        uid:
          type: string
          minLength: 1
          maxLength: 128
    MountSelection:
      type: object
      additionalProperties: false
      required:
      - bindingId
      - bindingVersion
      - mount
      properties:
        bindingId:
          type: string
          format: uuid
        bindingVersion:
          type: integer
          format: int64
          minimum: 1
        mount:
          $ref: '#/components/schemas/PermittedMount'
    AllowedRuntime:
      type: object
      additionalProperties: false
      required:
      - runtime
      - resources
      - mounts
      properties:
        limits:
          $ref: '#/components/schemas/ExecutionLimits'
        runtime:
          $ref: '#/components/schemas/RuntimeRef'
        resources:
          $ref: '#/components/schemas/WorkerResources'
        mounts:
          type: array
          maxItems: 16
          minItems: 0
          items:
            $ref: '#/components/schemas/MountSelection'
    AssignmentExecution:
      type: object
      additionalProperties: false
      required:
      - defaultRuntimeId
      - allowed
      properties:
        defaultRuntimeId:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z][a-z0-9-]{0,62}$
        allowed:
          type: array
          maxItems: 16
          minItems: 1
          items:
            $ref: '#/components/schemas/AllowedRuntime'
    ResolvedMount:
      type: object
      additionalProperties: false
      required:
      - binding
      - mount
      properties:
        binding:
          $ref: '#/components/schemas/StorageBinding'
        mount:
          $ref: '#/components/schemas/PermittedMount'
    ResolvedRuntime:
      type: object
      additionalProperties: false
      required:
      - definition
      - definitionDigest
      - resources
      - mounts
      - pullSecrets
      properties:
        limits:
          $ref: '#/components/schemas/ExecutionLimits'
        definition:
          $ref: '#/components/schemas/RuntimeDefinition'
        definitionDigest:
          type: string
          pattern: ^[a-f0-9]{64}$
        resources:
          $ref: '#/components/schemas/WorkerResources'
        mounts:
          type: array
          maxItems: 16
          minItems: 0
          items:
            $ref: '#/components/schemas/ResolvedMount'
        pullSecrets:
          type: array
          maxItems: 4
          minItems: 0
          items:
            $ref: '#/components/schemas/PullSecretBinding'
    ResolvedPolicy:
      type: object
      additionalProperties: false
      required:
      - installationId
      - instanceId
      - namespace
      - namespaceUid
      - generation
      - defaultRuntimeId
      - runtimes
      properties:
        installationId:
          type: string
          format: uuid
        instanceId:
          type: string
          format: uuid
        namespace:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z][a-z0-9-]{0,62}$
        namespaceUid:
          type: string
          minLength: 1
          maxLength: 128
        generation:
          type: integer
          format: int64
          minimum: 1
        defaultRuntimeId:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z][a-z0-9-]{0,62}$
        runtimes:
          type: array
          maxItems: 16
          minItems: 1
          items:
            $ref: '#/components/schemas/ResolvedRuntime'
    ExecutionPolicyView:
      type: object
      additionalProperties: false
      required:
      - assignmentId
      - assignmentVersion
      - desiredGeneration
      - appliedGeneration
      - state
      - desired
      - digest
      properties:
        assignmentId:
          type: string
          format: uuid
        assignmentVersion:
          type: integer
          format: int64
          minimum: 1
        desiredGeneration:
          type: integer
          format: int64
          minimum: 1
        appliedGeneration:
          type: integer
          format: int64
          minimum: 0
        state:
          type: string
          enum:
          - Pending
          - Reconciling
          - Waiting
          - Applied
        desired:
          $ref: '#/components/schemas/ResolvedPolicy'
        digest:
          type: string
          pattern: ^[a-f0-9]{64}$
    ExecutionAccepted:
      type: object
      additionalProperties: false
      required:
      - eventId
      - assignmentVersion
      - policyGeneration
      - policyDigest
      properties:
        eventId:
          type: string
          format: uuid
        assignmentVersion:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
        policyGeneration:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
        policyDigest:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{64}$
    ExecutionLimits:
      type: object
      additionalProperties: false
      description: Optional policy limits; omitting the object selects these defaults.
      required: [ttlSeconds, exclusive, serializeProfile, maxEnvironments, maxLeases, idleSeconds]
      properties:
        ttlSeconds: { type: integer, minimum: 30, maximum: 600, default: 120 }
        exclusive: { type: boolean, default: false }
        serializeProfile: { type: boolean, default: false }
        maxEnvironments: { type: integer, minimum: 1, maximum: 64, default: 8 }
        maxLeases: { type: integer, minimum: 1, maximum: 128, default: 32 }
        idleSeconds: { type: integer, minimum: 30, maximum: 86400, default: 900 }
