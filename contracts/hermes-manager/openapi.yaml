openapi: 3.1.0
info:
  title: Personal Hermes manager administration API
  version: 1.0.0
  description: >-
    Administration of personal Hermes instances: who gets an instance, on which
    template, with which volumes, terminal backends, admin settings and admin
    secrets. Callers authenticate with a Keycloak access token for the
    administration audience, or with the browser session from /auth/login.
    Authority comes only from the caller's current PostgreSQL administrator
    grant. Cookie and bearer credentials are never combined; browser mutations
    need the exact administration Origin and the session's X-CSRF-Token. Every
    mutation needs an Idempotency-Key; updates and deletes of versioned
    resources need If-Match with the quoted version from the ETag. Mutations
    commit desired state, the idempotency receipt and an audit event together
    before responding. Every response is no-store; request bodies and headers
    are each limited to 16 KiB. Secret values are write-only and never
    returned.
servers:
  - url: https://hermes-admin.example.org
security:
  - AdministratorAccessToken: []
  - AdministratorSession: []
paths:
  /auth/login:
    get:
      operationId: beginAdministratorLogin
      security: []
      parameters:
        - name: returnTo
          in: query
          schema: { type: string, maxLength: 2048, default: '/' }
          description: Local dashboard path; authentication, API and platform paths are refused
      responses:
        '303':
          description: Single-use PKCE flow committed; redirect to the identity provider
          headers:
            Location: { schema: { type: string, format: uri } }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /auth/oidc/callback:
    get:
      operationId: completeAdministratorLogin
      security: []
      description: Needs the browser proof cookie of the flow; codes and provider errors are never reflected
      parameters:
        - { name: state, in: query, required: true, schema: { type: string, maxLength: 128 } }
        - { name: code, in: query, schema: { type: string, maxLength: 4096 } }
        - { name: iss, in: query, schema: { type: string } }
        - { name: session_state, in: query, schema: { type: string, maxLength: 1024 } }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
      responses:
        '303':
          description: Session created for an identity with an active grant; redirect to the dashboard
          headers:
            Location: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /auth/logout:
    post:
      operationId: logoutAdministrator
      security:
        - AdministratorSession: []
      parameters:
        - { name: Origin, in: header, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Csrf' }
      responses:
        '204': { description: Session revoked and cookies expired }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/session:
    get:
      operationId: getSession
      responses:
        '200':
          description: The authenticated administrator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/identities:
    get:
      operationId: listIdentities
      description: Identities the manager knows from sign-ins, grants and assignments
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/After' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/identities/{identityId}:
    get:
      operationId: getIdentity
      parameters:
        - { $ref: '#/components/parameters/IdentityId' }
      responses:
        '200':
          description: The identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentitySummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/directory-users:
    get:
      operationId: searchDirectory
      description: Read-only Keycloak lookup. A result is a candidate, not an assignment or a grant.
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/After' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: One page; `enabled` is false when no directory is configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectoryPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/assignments:
    get:
      operationId: listAssignments
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - name: access
          in: query
          schema: { $ref: '#/components/schemas/Access' }
        - name: templateId
          in: query
          schema: { $ref: '#/components/schemas/Name' }
        - { $ref: '#/components/parameters/After' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
    post:
      operationId: createAssignment
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAssignment' }
      responses:
        '202':
          description: Committed; the controller commissions the instance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentReceipt' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/assignments/{assignmentId}:
    get:
      operationId: getAssignment
      parameters:
        - { $ref: '#/components/parameters/AssignmentId' }
      responses:
        '200':
          description: The assignment and its instance status
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateAssignment
      description: Replaces the given fields; the identity and instance never change
      parameters:
        - { $ref: '#/components/parameters/AssignmentId' }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentChanges' }
      responses:
        '202':
          description: Committed; the controller reconciles the instance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentReceipt' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/Stale' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/assignments/{assignmentId}/preview:
    post:
      operationId: previewAssignment
      description: Checks proposed changes without committing them
      parameters:
        - { $ref: '#/components/parameters/AssignmentId' }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentChanges' }
      responses:
        '200':
          description: Whether the change is valid and what it would restart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentPreview' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/assignments/{assignmentId}/retry:
    post:
      operationId: retryAssignment
      description: Asks the controller to reconcile again without changing desired state
      parameters:
        - { $ref: '#/components/parameters/AssignmentId' }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/Csrf' }
      responses:
        '202':
          description: Committed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentReceipt' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/Stale' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/assignment-rollouts:
    post:
      operationId: rolloutTemplate
      description: Applies one template version to selected assignments, each as its own change. Retrying with the same key repeats only the members that did not commit.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Rollout' }
      responses:
        '200':
          description: The result of every member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolloutResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/instances/{instanceId}:
    get:
      operationId: getInstance
      parameters:
        - { $ref: '#/components/parameters/InstanceId' }
      responses:
        '200':
          description: Desired and observed state of the instance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instance' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/instances/{instanceId}/environments:
    get:
      operationId: listEnvironments
      description: Terminal environments and lease counts, without command content or credentials
      parameters:
        - { $ref: '#/components/parameters/InstanceId' }
      responses:
        '200':
          description: The instance's environments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvironmentList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orphans:
    get:
      operationId: listOrphans
      description: >-
        Namespaces and PersistentVolumes carrying this installation's label
        that belong to no recorded instance, as the controller last saw them.
        They are never adopted or deleted.
      responses:
        '200':
          description: The latest orphan report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrphanReport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/templates:
    get:
      operationId: listTemplates
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/After' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/templates/validate:
    post:
      operationId: validateTemplate
      parameters:
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateDraft' }
      responses:
        '200':
          description: Validation against installation settings; nothing is stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/templates/{catalogId}/versions:
    get:
      operationId: listTemplateVersions
      parameters:
        - { $ref: '#/components/parameters/CatalogId' }
        - { $ref: '#/components/parameters/After' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Versions, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createTemplateDraft
      parameters:
        - { $ref: '#/components/parameters/CatalogId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateDraft' }
      responses:
        '201':
          description: The next version, as a draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionReceipt' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/templates/{catalogId}/versions/{version}:
    get:
      operationId: getTemplateVersion
      parameters:
        - { $ref: '#/components/parameters/CatalogId' }
        - { $ref: '#/components/parameters/Version' }
      responses:
        '200':
          description: One version; the ETag is its revision
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateVersion' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: editTemplateDraft
      parameters:
        - { $ref: '#/components/parameters/CatalogId' }
        - { $ref: '#/components/parameters/Version' }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateDraft' }
      responses:
        '200':
          description: The draft's new revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionReceipt' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/Stale' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/templates/{catalogId}/versions/{version}/publish:
    post:
      operationId: publishTemplate
      parameters:
        - { $ref: '#/components/parameters/CatalogId' }
        - { $ref: '#/components/parameters/Version' }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/Csrf' }
      responses:
        '200':
          description: Validated and frozen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionReceipt' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/Stale' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/templates/{catalogId}/versions/{version}/withdraw:
    post:
      operationId: withdrawTemplate
      parameters:
        - { $ref: '#/components/parameters/CatalogId' }
        - { $ref: '#/components/parameters/Version' }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/Csrf' }
      responses:
        '200':
          description: No longer selectable; existing pins keep it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionReceipt' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/Stale' }
  /api/v1/terminal-backends:
    get:
      operationId: listTerminalBackends
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/After' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/terminal-backends/validate:
    post:
      operationId: validateTerminalBackend
      parameters:
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackendDraft' }
      responses:
        '200':
          description: Validation against installation settings; nothing is stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/terminal-backends/{catalogId}/versions:
    get:
      operationId: listTerminalBackendVersions
      parameters:
        - { $ref: '#/components/parameters/CatalogId' }
        - { $ref: '#/components/parameters/After' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Versions, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createTerminalBackendDraft
      parameters:
        - { $ref: '#/components/parameters/CatalogId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackendDraft' }
      responses:
        '201':
          description: The next version, as a draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionReceipt' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/terminal-backends/{catalogId}/versions/{version}:
    get:
      operationId: getTerminalBackendVersion
      parameters:
        - { $ref: '#/components/parameters/CatalogId' }
        - { $ref: '#/components/parameters/Version' }
      responses:
        '200':
          description: One version; the ETag is its revision
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackendVersion' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: editTerminalBackendDraft
      parameters:
        - { $ref: '#/components/parameters/CatalogId' }
        - { $ref: '#/components/parameters/Version' }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackendDraft' }
      responses:
        '200':
          description: The draft's new revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionReceipt' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/Stale' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/terminal-backends/{catalogId}/versions/{version}/publish:
    post:
      operationId: publishTerminalBackend
      parameters:
        - { $ref: '#/components/parameters/CatalogId' }
        - { $ref: '#/components/parameters/Version' }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/Csrf' }
      responses:
        '200':
          description: Validated and frozen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionReceipt' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/Stale' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/terminal-backends/{catalogId}/versions/{version}/withdraw:
    post:
      operationId: withdrawTerminalBackend
      parameters:
        - { $ref: '#/components/parameters/CatalogId' }
        - { $ref: '#/components/parameters/Version' }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/Csrf' }
      responses:
        '200':
          description: No longer selectable; existing pins keep it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionReceipt' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/Stale' }
  /api/v1/storage-sources:
    get:
      operationId: listStorageSources
      description: Installation configuration; read-only
      responses:
        '200':
          description: The approved sources
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageSourceList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/volumes:
    get:
      operationId: listVolumes
      description: Every assigned volume, for reviewing paths and sizes per source
      parameters:
        - name: source
          in: query
          schema: { $ref: '#/components/schemas/Name' }
        - { $ref: '#/components/parameters/After' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VolumePage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/secrets:
    get:
      operationId: listSecrets
      parameters:
        - { $ref: '#/components/parameters/After' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Secret metadata; values are never returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/secrets/{secretName}:
    put:
      operationId: writeSecret
      description: Writes a new version. The kind is fixed when the secret is created. Instances that use the secret restart to receive it.
      parameters:
        - { $ref: '#/components/parameters/SecretName' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecretWrite' }
      responses:
        '200':
          description: The new version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretReceipt' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      operationId: deleteSecret
      description: Deletes every version of a secret nothing references
      parameters:
        - { $ref: '#/components/parameters/SecretName' }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/Csrf' }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretReceipt' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/Stale' }
  /api/v1/administrators:
    get:
      operationId: listAdministrators
      parameters:
        - { $ref: '#/components/parameters/After' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministratorPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: grantAdministrator
      description: Needs a grant that can manage administrators. The target must have signed in once.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantRequest' }
      responses:
        '201':
          description: Granted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrantReceipt' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/administrators/{identityId}:
    get:
      operationId: getAdministrator
      parameters:
        - { $ref: '#/components/parameters/IdentityId' }
      responses:
        '200':
          description: The grant
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Administrator' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateAdministrator
      description: Changes or revokes a grant; the last active manager cannot be removed
      parameters:
        - { $ref: '#/components/parameters/IdentityId' }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantChange' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrantReceipt' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/Stale' }
  /api/v1/administrator-candidates:
    get:
      operationId: listAdministratorCandidates
      description: Identities that have signed in and hold no grant
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/After' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      parameters:
        - name: targetKind
          in: query
          schema: { type: string, maxLength: 64 }
        - name: targetId
          in: query
          schema: { type: string, maxLength: 128 }
        - { $ref: '#/components/parameters/After' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/audit-events/{eventId}:
    get:
      operationId: getAuditEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: One event with its redacted change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEvent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    AdministratorAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak user access token for the administration audience
    AdministratorSession:
      type: apiKey
      in: cookie
      name: __Host-hermes-admin
      description: Opaque browser session; also needs the __Host-hermes-admin-browser proof cookie
  headers:
    ETag:
      description: The quoted version of the resource
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' }
      description: One intended change. Repeating it with the same body returns the original result.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    Csrf:
      name: X-CSRF-Token
      in: header
      schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      description: Required for browser-session mutations; ignored for bearer requests
    Search:
      name: q
      in: query
      schema: { type: string, maxLength: 128 }
    After:
      name: after
      in: query
      schema: { type: string, maxLength: 256 }
      description: The previous page's nextCursor
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    IdentityId:
      name: identityId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InstanceId:
      name: instanceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CatalogId:
      name: catalogId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Name' }
    Version:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    SecretName:
      name: secretName
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Name' }
  responses:
    Unauthenticated:
      description: No valid credential
      headers:
        WWW-Authenticate: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: No current grant, or a CSRF or Origin failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflicts with current state or an earlier request with this key
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Stale:
      description: If-Match does not match the current version
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Invalid:
      description: Malformed input, or configuration that fails validation (with problems)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: A dependency is unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Name:
      type: string
      minLength: 1
      maxLength: 63
      pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
    Identity:
      $ref: './router.openapi.yaml#/components/schemas/Identity'
    Timestamp:
      type: string
      format: date-time
    Access:
      type: string
      enum: [enabled, suspended, revoked]
    VersionRef:
      type: object
      additionalProperties: false
      required: [id, version]
      properties:
        id: { $ref: '#/components/schemas/Name' }
        version: { type: integer, minimum: 1 }
    Problem:
      type: object
      additionalProperties: false
      required: [pointer, code, severity]
      properties:
        pointer: { type: string, description: JSON pointer into the submitted document }
        code: { type: string }
        severity: { type: string, enum: [error] }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum:
            - access_denied
            - administrator_grant_exists
            - administrators_exist
            - assignment_exists
            - backend_unavailable
            - concurrent_change
            - dependency_unavailable
            - foreign_issuer
            - idempotency_conflict
            - identity_not_verified
            - invalid_configuration
            - invalid_identity
            - invalid_identity_evidence
            - invalid_name
            - invalid_request
            - invalid_secret_value
            - last_administrator
            - not_found
            - registry_unavailable
            - secret_in_use
            - stale_version
            - template_unavailable
            - version_not_draft
        problems:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/Problem' }
    Session:
      type: object
      additionalProperties: false
      required: [actor, permittedActions, csrfToken]
      properties:
        actor: { $ref: '#/components/schemas/Identity' }
        permittedActions:
          type: array
          items: { type: string, enum: [administer, administrator.manage] }
        csrfToken: { type: [string, 'null'], description: Null for bearer requests }
    IdentitySummary:
      type: object
      additionalProperties: false
      required: [id, identity, displayName, email, verified, assignmentId, administrator]
      properties:
        id: { type: string, format: uuid }
        identity: { $ref: '#/components/schemas/Identity' }
        displayName: { type: [string, 'null'] }
        email: { type: [string, 'null'], description: A label, never a key }
        verified: { type: boolean, description: Has signed in to the manager at least once }
        assignmentId: { type: [string, 'null'], format: uuid }
        administrator: { type: boolean }
    IdentityPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/IdentitySummary' } }
        nextCursor: { type: [string, 'null'] }
    DirectoryUser:
      type: object
      additionalProperties: false
      required: [identity, username, displayName, email, enabled]
      properties:
        identity: { $ref: '#/components/schemas/Identity' }
        username: { type: [string, 'null'] }
        displayName: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        enabled: { type: boolean }
    DirectoryPage:
      type: object
      additionalProperties: false
      required: [enabled, items, nextCursor]
      properties:
        enabled: { type: boolean }
        items: { type: array, items: { $ref: '#/components/schemas/DirectoryUser' } }
        nextCursor: { type: [string, 'null'] }
    Volume:
      $ref: './schemas/template-v2.json#/$defs/volume'
    TerminalGrant:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [per_session, per_profile_on_demand, per_profile_always_running]
          default: per_session
        default: { $ref: '#/components/schemas/Name' }
        allowed:
          type: object
          description: Terminal backend ID to version
          propertyNames: { $ref: '#/components/schemas/Name' }
          additionalProperties: { type: integer, minimum: 1 }
    SecretReference:
      $ref: './schemas/template-v2.json#/$defs/secretReference'
    AssignmentSpec:
      type: object
      additionalProperties: false
      required: [access, template]
      properties:
        access: { $ref: '#/components/schemas/Access' }
        template: { $ref: '#/components/schemas/VersionRef' }
        volumes:
          type: object
          propertyNames: { $ref: '#/components/schemas/Name' }
          additionalProperties: { $ref: '#/components/schemas/Volume' }
        terminal: { $ref: '#/components/schemas/TerminalGrant' }
        adminConfig: { type: object, description: Overrides layered over the template's admin settings }
        secrets: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/SecretReference' } }
    CreateAssignment:
      type: object
      additionalProperties: false
      required: [identity, spec]
      properties:
        identity: { $ref: '#/components/schemas/Identity' }
        spec: { $ref: '#/components/schemas/AssignmentSpec' }
    AssignmentChanges:
      type: object
      additionalProperties: false
      properties:
        access: { $ref: '#/components/schemas/Access' }
        template: { $ref: '#/components/schemas/VersionRef' }
        volumes:
          type: object
          propertyNames: { $ref: '#/components/schemas/Name' }
          additionalProperties: { $ref: '#/components/schemas/Volume' }
        terminal: { $ref: '#/components/schemas/TerminalGrant' }
        adminConfig: { type: object }
        secrets: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/SecretReference' } }
    AssignmentReceipt:
      type: object
      additionalProperties: false
      required: [assignmentId, instanceId, version]
      properties:
        assignmentId: { type: string, format: uuid }
        instanceId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
    AssignmentPreview:
      type: object
      additionalProperties: false
      required: [valid, problems, restartsHermes, recreatesTerminals]
      properties:
        valid: { type: boolean }
        problems: { type: array, items: { $ref: '#/components/schemas/Problem' } }
        restartsHermes: { type: boolean }
        recreatesTerminals: { type: boolean }
    Phase:
      type: string
      enum: [provisioning, ready, stopping, retained, blocked]
    Condition:
      type: object
      additionalProperties: false
      required: [type, status, reason]
      properties:
        type: { type: string, enum: [storage, nativeInit, nativeAuth, terminal] }
        status: { type: string, enum: ['true', 'false', unknown] }
        reason: { type: string, maxLength: 64 }
    Instance:
      type: object
      additionalProperties: false
      required: [id, assignmentId, namespace, desiredGeneration, observedGeneration, executionGeneration, phase, blockedReason, conditions, observedAt]
      properties:
        id: { type: string, format: uuid }
        assignmentId: { type: string, format: uuid }
        namespace: { type: string }
        desiredGeneration: { type: integer, minimum: 1 }
        observedGeneration: { type: integer, minimum: 0 }
        executionGeneration: { type: integer, minimum: 1 }
        phase: { $ref: '#/components/schemas/Phase' }
        blockedReason: { type: [string, 'null'] }
        conditions: { type: array, items: { $ref: '#/components/schemas/Condition' } }
        observedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
    AssignmentSummary:
      type: object
      additionalProperties: false
      required: [id, identity, access, template, version, instanceId, phase]
      properties:
        id: { type: string, format: uuid }
        identity: { $ref: '#/components/schemas/Identity' }
        access: { $ref: '#/components/schemas/Access' }
        template: { $ref: '#/components/schemas/VersionRef' }
        version: { type: integer, minimum: 1 }
        instanceId: { type: string, format: uuid }
        phase: { $ref: '#/components/schemas/Phase' }
    AssignmentPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AssignmentSummary' } }
        nextCursor: { type: [string, 'null'] }
    Assignment:
      type: object
      additionalProperties: false
      required: [id, identityId, identity, spec, version, instance]
      properties:
        id: { type: string, format: uuid }
        identityId: { type: string, format: uuid }
        identity: { $ref: '#/components/schemas/Identity' }
        spec: { $ref: '#/components/schemas/AssignmentSpec' }
        version: { type: integer, minimum: 1 }
        instance: { $ref: '#/components/schemas/Instance' }
    Rollout:
      type: object
      additionalProperties: false
      required: [template, items]
      properties:
        template: { $ref: '#/components/schemas/VersionRef' }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [assignmentId, expectedVersion]
            properties:
              assignmentId: { type: string, format: uuid }
              expectedVersion: { type: integer, minimum: 1 }
    RolloutResult:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [assignmentId, outcome, receipt, error]
            properties:
              assignmentId: { type: string, format: uuid }
              outcome: { type: string, enum: [accepted, rejected] }
              receipt: { oneOf: [{ $ref: '#/components/schemas/AssignmentReceipt' }, { type: 'null' }] }
              error: { oneOf: [{ $ref: '#/components/schemas/Error' }, { type: 'null' }] }
    Environment:
      type: object
      additionalProperties: false
      required: [id, backend, mode, session, generation, state, failure, leases, createdAt]
      properties:
        id: { type: string, format: uuid }
        backend: { $ref: '#/components/schemas/VersionRef' }
        mode: { type: string, enum: [per_session, per_profile_on_demand, per_profile_always_running] }
        session: { type: [string, 'null'] }
        generation: { type: integer, minimum: 1 }
        state: { type: string, enum: [pending, starting, ready, draining, retired] }
        failure:
          type: [string, 'null']
          enum: [image_unavailable, start_failed, contract_failed, null]
          description: Why the worker failed; it drains and no other image replaces it
        leases: { type: integer, minimum: 0 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    EnvironmentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, maxItems: 256, items: { $ref: '#/components/schemas/Environment' } }
    Orphan:
      type: object
      additionalProperties: false
      required: [kind, name, uid, firstSeenAt, lastSeenAt]
      properties:
        kind: { type: string, enum: [namespace, persistent_volume] }
        name: { type: string, minLength: 1, maxLength: 253 }
        uid: { type: string, minLength: 1, maxLength: 128 }
        firstSeenAt: { $ref: '#/components/schemas/Timestamp' }
        lastSeenAt: { $ref: '#/components/schemas/Timestamp' }
    OrphanReport:
      type: object
      additionalProperties: false
      required: [scannedAt, items]
      properties:
        scannedAt:
          description: When the controller last completed a scan; null before the first one
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - { type: 'null' }
        items: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/Orphan' } }
    CatalogSummary:
      type: object
      additionalProperties: false
      required: [id, versions, latestPublished, draft, assignments]
      properties:
        id: { $ref: '#/components/schemas/Name' }
        versions: { type: integer, minimum: 1 }
        latestPublished: { type: [integer, 'null'] }
        draft: { type: [integer, 'null'], description: The newest draft version, if any }
        assignments: { type: integer, minimum: 0, description: Assignments pinning any version }
    CatalogPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CatalogSummary' } }
        nextCursor: { type: [string, 'null'] }
    VersionState:
      type: string
      enum: [draft, published, withdrawn]
    VersionSummary:
      type: object
      additionalProperties: false
      required: [id, version, state, revision, updatedAt, assignments]
      properties:
        id: { $ref: '#/components/schemas/Name' }
        version: { type: integer, minimum: 1 }
        state: { $ref: '#/components/schemas/VersionState' }
        revision: { type: integer, minimum: 1 }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        assignments: { type: integer, minimum: 0 }
    VersionPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/VersionSummary' } }
        nextCursor: { type: [string, 'null'] }
    TemplateDraft:
      type: object
      additionalProperties: false
      required: [definition]
      properties:
        definition: { $ref: './schemas/template-v2.json' }
    BackendDraft:
      type: object
      additionalProperties: false
      required: [definition]
      properties:
        definition: { $ref: './schemas/terminal-backend-v1.json' }
    TemplateVersion:
      type: object
      additionalProperties: false
      required: [id, version, state, revision, updatedAt, assignments, definition]
      properties:
        id: { $ref: '#/components/schemas/Name' }
        version: { type: integer, minimum: 1 }
        state: { $ref: '#/components/schemas/VersionState' }
        revision: { type: integer, minimum: 1 }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        assignments: { type: integer, minimum: 0 }
        definition: { $ref: './schemas/template-v2.json' }
    BackendVersion:
      type: object
      additionalProperties: false
      required: [id, version, state, revision, updatedAt, assignments, definition]
      properties:
        id: { $ref: '#/components/schemas/Name' }
        version: { type: integer, minimum: 1 }
        state: { $ref: '#/components/schemas/VersionState' }
        revision: { type: integer, minimum: 1 }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        assignments: { type: integer, minimum: 0 }
        definition: { $ref: './schemas/terminal-backend-v1.json' }
    VersionReceipt:
      type: object
      additionalProperties: false
      required: [id, version, revision]
      properties:
        id: { $ref: '#/components/schemas/Name' }
        version: { type: integer, minimum: 1 }
        revision: { type: integer, minimum: 1 }
    Validation:
      type: object
      additionalProperties: false
      required: [valid, problems]
      properties:
        valid: { type: boolean }
        problems: { type: array, items: { $ref: '#/components/schemas/Problem' } }
    StorageSource:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Name' }
        storageClass:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: { type: string }
        localPath:
          type: object
          additionalProperties: false
          required: [node, root]
          properties:
            node: { type: string }
            root: { type: string }
        nfs:
          type: object
          additionalProperties: false
          required: [server, root]
          properties:
            server: { type: string }
            root: { type: string }
    StorageSourceList:
      type: object
      additionalProperties: false
      required: [items, dataIdentity]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StorageSource' } }
        dataIdentity:
          type: object
          additionalProperties: false
          required: [uid, gid]
          properties:
            uid: { type: integer }
            gid: { type: integer }
    VolumeUse:
      type: object
      additionalProperties: false
      required: [assignmentId, identity, name, source, path, sizeGib, readOnly]
      properties:
        assignmentId: { type: string, format: uuid }
        identity: { $ref: '#/components/schemas/Identity' }
        name: { $ref: '#/components/schemas/Name' }
        source: { $ref: '#/components/schemas/Name' }
        path: { type: [string, 'null'] }
        sizeGib: { type: [integer, 'null'] }
        readOnly: { type: boolean }
    VolumePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/VolumeUse' } }
        nextCursor: { type: [string, 'null'] }
    SecretKind:
      type: string
      enum: [env, file, registry]
    SecretSummary:
      type: object
      additionalProperties: false
      required: [name, kind, version, updatedAt, references]
      properties:
        name: { $ref: '#/components/schemas/Name' }
        kind: { $ref: '#/components/schemas/SecretKind' }
        version: { type: integer, minimum: 1 }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        references: { type: integer, minimum: 0, description: Catalog versions and assignments naming it }
    SecretPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SecretSummary' } }
        nextCursor: { type: [string, 'null'] }
    SecretWrite:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties:
        kind: { $ref: '#/components/schemas/SecretKind' }
        value: { type: string, minLength: 1, maxLength: 8192, writeOnly: true }
    SecretReceipt:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: { $ref: '#/components/schemas/Name' }
        version: { type: integer, minimum: 1 }
    Administrator:
      type: object
      additionalProperties: false
      required: [identityId, identity, active, canManageAdministrators, version, updatedAt]
      properties:
        identityId: { type: string, format: uuid }
        identity: { $ref: '#/components/schemas/Identity' }
        active: { type: boolean }
        canManageAdministrators: { type: boolean }
        version: { type: integer, minimum: 1 }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    AdministratorPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Administrator' } }
        nextCursor: { type: [string, 'null'] }
    GrantRequest:
      type: object
      additionalProperties: false
      required: [identity, canManageAdministrators]
      properties:
        identity: { $ref: '#/components/schemas/Identity' }
        canManageAdministrators: { type: boolean }
    GrantChange:
      type: object
      additionalProperties: false
      required: [active, canManageAdministrators]
      properties:
        active: { type: boolean }
        canManageAdministrators: { type: boolean }
    GrantReceipt:
      type: object
      additionalProperties: false
      required: [identityId, version]
      properties:
        identityId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
    AuditActor:
      type: object
      additionalProperties: false
      required: [kind, identity]
      properties:
        kind: { type: string, enum: [administrator, operator, controller] }
        identity: { oneOf: [{ $ref: '#/components/schemas/Identity' }, { type: 'null' }] }
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, occurredAt, actor, action, target, requestId, change]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
        actor: { $ref: '#/components/schemas/AuditActor' }
        action: { type: string }
        target:
          type: object
          additionalProperties: false
          required: [kind, id]
          properties:
            kind: { type: string }
            id: { type: string }
        requestId: { type: string, format: uuid }
        change: { type: object, description: Redacted summary; never secret values }
    AuditPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        nextCursor: { type: [string, 'null'] }
