openapi: 3.1.0
info:
  title: Personal Hermes manager administration API
  version: 0.1.0
  description: >-
    Versioned administration boundary, in development. The API authenticates
    Keycloak access
    tokens for the configured management audience, authorized client and
    installation-scoped PostgreSQL administrator grant. Keycloak role claims and personal assignments, realm membership,
    service certificates and asserted headers grant no administrator permission.
    Require a signed Keycloak user-session sid; client-credentials tokens are
    unsupported. Management/router OIDC clients must disable service accounts.
    Optional browser OIDC sessions use S256 PKCE, server-side encrypted tokens,
    opaque host-only HttpOnly cookies and the same API. Cookie mutations require
    the exact administration Origin and X-CSRF-Token from GET /api/v1/session.
    Do not combine cookie and bearer credentials. The protected dashboard shares this boundary.
    Every response is no-store. Request bodies and headers are each limited to
    16 KiB. Unknown or duplicate JSON/query fields are rejected. Mutations commit
    desired state or immutable approved references, actor-scoped idempotency and
    audit before returning 202. Assignment lifecycle commands also commit an
    operation; execution policy changes preserve desired/applied generations. Native
    files, histories, provider credentials and arbitrary Kubernetes specs are
    absent from this contract. Resolver requests use the separate router contract
    and mTLS listener; execution credentials cannot call this API.
servers:
  - url: https://hermes-admin.example.org
security:
  - AdministratorAccessToken: []
  - AdministratorSession: []
paths:
  /auth/login:
    get:
      operationId: beginAdministratorLogin
      security: []
      parameters:
        - name: returnTo
          in: query
          schema: { type: string, maxLength: 2048, default: '/' }
          description: Local UI path only; auth, API and platform paths are rejected
      responses:
        '303':
          description: Committed single-use PKCE/state flow, then provider redirect; previous browser sessions invalidated
          headers:
            Location: { schema: { type: string, format: uri } }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /auth/oidc/callback:
    get:
      operationId: completeAdministratorLogin
      security: []
      description: Browser proof and current single-use state required; codes and provider errors are never reflected
      parameters:
        - { name: state, in: query, required: true, schema: { type: string, maxLength: 128 } }
        - { name: code, in: query, schema: { type: string, maxLength: 4096 } }
        - { name: iss, in: query, schema: { type: string } }
        - { name: session_state, in: query, schema: { type: string, maxLength: 1024 } }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
      responses:
        '303':
          description: Committed opaque administrator session, then local UI redirect
          headers:
            Location: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /auth/logout:
    post:
      operationId: logoutAdministrator
      security:
        - AdministratorSession: []
      description: Exact Origin and session CSRF required; durable session revocation precedes best-effort provider token revocation
      parameters:
        - { name: Origin, in: header, required: true, schema: { type: string, format: uri } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
      responses:
        '204': { description: Session revoked and browser cookies expired }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/session:
    get:
      operationId: getAdministrationSession
      responses:
        '200':
          description: Verified human administrator and permitted actions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/identities:
    get:
      operationId: listIdentities
      description: Exact registered subjects. Directory verification is false unless a configured read-only directory
        adapter has verified the subject. Email never selects, links or transfers an assignment.
      parameters:
      - $ref: '#/components/parameters/ListSearch'
      - $ref: '#/components/parameters/ListSort'
      - $ref: '#/components/parameters/ListAfter'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/AccessFilter'
      - $ref: '#/components/parameters/StateFilter'
      - $ref: '#/components/parameters/TemplateFilter'
      - $ref: '#/components/parameters/SourceFilter'
      - $ref: '#/components/parameters/AssignedFilter'
      - $ref: '#/components/parameters/IdentityFilter'
      responses:
        '200':
          description: Bounded registered-identity page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - nextCursor
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/IdentityView'
                  nextCursor:
                    $ref: '#/components/schemas/ListCursor'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/assignments/{id}/template-preview:
    get:
      operationId: previewAssignmentTemplate
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: templateId, in: query, required: true, schema: { type: string } }
        - { name: templateVersion, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Explicit selected scope and pinned versions; acknowledgement is separate from rollout completion.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplatePreview' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/StaleVersion' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/assignments/{id}/template:
    post:
      operationId: setAssignmentTemplate
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateSelection' }
      responses:
        '202':
          description: Explicit selected scope and pinned versions; acknowledgement is separate from rollout completion.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Accepted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/StaleVersion' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/template-batches/preview:
    post:
      operationId: previewTemplateBatch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateBatch' }
      responses:
        '200':
          description: Explicit selected scope and pinned versions; acknowledgement is separate from rollout completion.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateBatchPreview' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/StaleVersion' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/template-batches:
    post:
      operationId: applyTemplateBatch
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateBatch' }
      responses:
        '202':
          description: Explicit selected scope and pinned versions; acknowledgement is separate from rollout completion.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateBatchAccepted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/StaleVersion' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/template-batches/{id}:
    get:
      operationId: getTemplateBatch
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Explicit selected scope and pinned versions; acknowledgement is separate from rollout completion.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateBatchView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/StaleVersion' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/template-batches/{id}/resume:
    post:
      operationId: resumeTemplateBatch
      description: Resume only pending members of the original actor's durable batch, preserving target, preconditions and child idempotency keys.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '202':
          description: Pending dispatch resumed; accepted members are never applied twice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateBatchAccepted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/administrators:
    get:
      operationId: listAdministrators
      parameters:
        - { $ref: '#/components/parameters/ListAfter' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/ListSearch' }
        - { $ref: '#/components/parameters/ListSort' }
      responses:
        '200':
          description: PostgreSQL is the sole administrator authority. OIDC roles do not grant access. Changes require administrator.manage and verified identity evidence; the last recoverable administrator is protected.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministratorPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/StaleVersion' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: createAdministratorGrant
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdministratorInput' }
      responses:
        '202':
          description: PostgreSQL is the sole administrator authority. OIDC roles do not grant access. Changes require administrator.manage and verified identity evidence; the last recoverable administrator is protected.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministratorAccepted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/StaleVersion' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/administrators/{id}:
    get:
      operationId: getAdministratorGrant
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: PostgreSQL is the sole administrator authority. OIDC roles do not grant access. Changes require administrator.manage and verified identity evidence; the last recoverable administrator is protected.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministratorGrant' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/StaleVersion' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
    patch:
      operationId: updateAdministratorGrant
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdministratorInput' }
      responses:
        '202':
          description: PostgreSQL is the sole administrator authority. OIDC roles do not grant access. Changes require administrator.manage and verified identity evidence; the last recoverable administrator is protected.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministratorAccepted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/StaleVersion' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/administrator-identities:
    get:
      operationId: listAdministratorCandidates
      parameters:
      - $ref: '#/components/parameters/ListAfter'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/ListSearch'
      - $ref: '#/components/parameters/ListSort'
      responses:
        '200':
          description: PostgreSQL is the sole administrator authority. OIDC roles do not grant access. Changes require administrator.manage and verified identity evidence; the last recoverable administrator is protected.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministratorCandidates' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/StaleVersion' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/template-drafts:
    get:
      operationId: listTemplateDrafts
      responses:
        '200':
          description: Versioned manager-owned draft; saving and publishing do not apply to live assignments. Published
            drafts and catalog versions are immutable.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - nextCursor
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/TemplateDraft'
                  nextCursor:
                    $ref: '#/components/schemas/ListCursor'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/StaleVersion'
        '422':
          $ref: '#/components/responses/InvalidConfiguration'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/ListSearch'
      - $ref: '#/components/parameters/ListSort'
      - $ref: '#/components/parameters/ListAfter'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/PublicationFilter'
    post:
      operationId: createTemplateDraft
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateDraftInput'
      responses:
        '202':
          description: Versioned manager-owned draft; saving and publishing do not apply to live assignments. Published
            drafts and catalog versions are immutable.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDraftAccepted'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/StaleVersion'
        '422':
          $ref: '#/components/responses/InvalidConfiguration'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/template-drafts/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      operationId: getTemplateDraft
      responses:
        '200':
          description: Versioned manager-owned draft; saving and publishing do not apply to live assignments. Published drafts and catalog versions are immutable.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateDraft' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/StaleVersion' }
        '422': { $ref: '#/components/responses/InvalidConfiguration' }
        '503': { $ref: '#/components/responses/Unavailable' }
    patch:
      operationId: updateTemplateDraft
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateDraftInput' }
      responses:
        '202':
          description: Versioned manager-owned draft; saving and publishing do not apply to live assignments. Published drafts and catalog versions are immutable.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateDraftAccepted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/StaleVersion' }
        '422': { $ref: '#/components/responses/InvalidConfiguration' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/template-drafts/{id}/publish:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      operationId: publishTemplateDraft
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '202':
          description: Versioned manager-owned draft; saving and publishing do not apply to live assignments. Published drafts and catalog versions are immutable.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateDraftAccepted' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/StaleVersion' }
        '422': { $ref: '#/components/responses/InvalidConfiguration' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/template-definitions:
    get:
      operationId: listTemplateDefinitions
      responses:
        '200':
          description: Bounded typed definitions with safe diagnostics; infrastructure rows are read-only.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - nextCursor
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/TemplateDefinitionView'
                  nextCursor:
                    $ref: '#/components/schemas/ListCursor'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/ListSearch'
      - $ref: '#/components/parameters/ListSort'
      - $ref: '#/components/parameters/ListAfter'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/SourceFilter'
  /api/v1/template-definitions/validate:
    post:
      operationId: validateTemplateDefinition
      description: Offline validation only. Does not persist, fetch references, execute images or commission resources. Unknown managed keys remain unvalidated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateDefinition' }
      responses:
        '200':
          description: Valid typed envelope and reviewed managed settings; other settings have no schema coverage.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [valid, schemaId, revision, coverage, problems]
                properties:
                  valid: { type: boolean, const: true }
                  schemaId: { type: string }
                  revision: { type: integer }
                  coverage: { type: string, enum: [reviewed_keys, envelope_only] }
                  problems: { type: array, maxItems: 0, items: { $ref: '#/components/schemas/ConfigurationProblem' } }
        '422': { $ref: '#/components/responses/InvalidConfiguration' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/template-definitions/{templateId}:
    parameters:
      - { name: templateId, in: path, required: true, schema: { type: string, maxLength: 63 } }
    get:
      operationId: getTemplateDefinition
      responses:
        '200':
          description: Typed effective definition, immutable catalog history and assigned-user count. No rejected input, manifests or credential values.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateDefinitionView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/configuration-schemas:
    get:
      operationId: getConfigurationSchemas
      responses:
        '200':
          description: Reviewed local schema IDs, revisions, content digests and compatible image digests. No remote schema retrieval.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schemas]
                properties:
