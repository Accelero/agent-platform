openapi: 3.1.0
info:
  title: Hermes router OIDC and session authentication
  version: 0.1.0
  description: >-
    Under development. No assignment or Kubernetes access. Server-side provider
    tokens are encrypted in a separate PostgreSQL schema. Public browser responses
    contain no provider tokens or session-recheck handles. All responses are
    no-store. Internal endpoints require distinct configured mTLS URI identities
    and finish within 1.8 seconds. Neither service identity grants assignments.
servers:
  - url: https://hermes.example.org
paths:
  /_platform/login:
    get:
      operationId: beginPlatformLogin
      parameters:
        - name: returnTo
          in: query
          schema: { type: string, default: '/', maxLength: 2048 }
          description: Local non-authentication UI path; native callbacks and API paths are rejected
      responses:
        '303':
          description: Single-use state/nonce/S256 PKCE committed before provider redirect; old browser sessions invalidated
          headers:
            Location: { schema: { type: string, format: uri } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /_platform/oidc/callback:
    get:
      operationId: completePlatformLogin
      description: Requires current browser proof and unused state; exact issuer and ID/access subject are verified; no backend selection from callback parameters
      parameters:
        - { name: state, in: query, required: true, schema: { type: string, maxLength: 128 } }
        - { name: code, in: query, schema: { type: string, maxLength: 4096 } }
        - { name: iss, in: query, schema: { type: string } }
        - { name: session_state, in: query, schema: { type: string, maxLength: 1024 } }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
      responses:
        '303':
          description: Opaque platform session committed before redirect
          headers:
            Location: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /_platform/me:
    get:
      operationId: getPlatformSession
      security: [{ PlatformSession: [] }]
      responses:
        '200':
          description: Current owner and browser CSRF token, without provider credentials
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [identity, csrfToken]
                properties:
                  identity: { $ref: '#/components/schemas/Identity' }
                  csrfToken: { $ref: '#/components/schemas/Handle' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /_platform/logout:
    post:
      operationId: logoutPlatform
      security: [{ PlatformSession: [] }]
      description: Exact Origin and CSRF required; session revocation commits before best-effort provider revocation; native cookie coordination remains a proxy integration gate
      parameters:
        - { name: Origin, in: header, required: true, schema: { type: string, format: uri } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { $ref: '#/components/schemas/Handle' } }
      responses:
        '204': { description: Platform session invalidated and platform cookies expired }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v1/forward-auth:
    servers: [{ url: 'https://router-auth.hermes-control.svc:8444' }]
    get:
      operationId: authenticateForwardedRequest
      security: [{ ForwardAuthMTLS: [] }]
      description: >-
        Exact configured ForwardAuth certificate URI SAN. Validate the platform
        cookies and configured public Host/HTTPS forwarded context. Headers from
        callers cannot assert identity. Missing sessions redirect only safe HTML
        GET navigation; native callbacks, WebSockets and API requests deny.
      parameters:
        - { name: X-Forwarded-Host, in: header, required: true, schema: { type: string } }
        - { name: X-Forwarded-Proto, in: header, required: true, schema: { type: string, const: https } }
        - { name: X-Forwarded-Method, in: header, required: true, schema: { type: string } }
        - { name: X-Forwarded-Uri, in: header, required: true, schema: { type: string, maxLength: 8192 } }
      responses:
        '200':
          description: Internal verified evidence for routing plugin, never sent to browser or native upstream
          headers:
            X-Hermes-Verified-Issuer: { schema: { type: string, format: uri } }
            X-Hermes-Verified-Subject: { schema: { type: string, minLength: 1, maxLength: 255 } }
            X-Hermes-Verified-Evidence: { schema: { type: string, maxLength: 16384 }, description: Fresh route-audience access token }
            X-Hermes-Verified-Session: { schema: { $ref: '#/components/schemas/Handle' }, description: Hash handle accepted only on the separate plugin mTLS boundary }
        '303':
          description: Fresh platform login required for safe browser navigation
          headers:
            Location: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v1/sessions/authorize:
    servers: [{ url: 'https://router-auth.hermes-control.svc:8444' }]
    post:
      operationId: authorizeEstablishedConnection
      security: [{ PluginMTLS: [] }]
      description: >-
        Exact plugin certificate URI SAN; browser cookie credentials are not
        accepted here. Re-evaluate the current session and refresh provider
        status/claims after 60 seconds. Revoked, switched, expired or old-epoch
        sessions fail closed. Unknown refresh outcomes require a fresh login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sessionId]
              properties:
                sessionId: { $ref: '#/components/schemas/Handle' }
      responses:
        '200':
          description: Internal fresh evidence for manager route recheck
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [identity, accessToken]
                properties:
                  identity: { $ref: '#/components/schemas/Identity' }
                  accessToken: { type: string, minLength: 1, maxLength: 16384 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    PlatformSession:
      type: apiKey
      in: cookie
      name: __Host-hermes-platform
      description: Opaque Secure/HttpOnly/SameSite=Lax cookie bound to a separate __Host-hermes-platform-browser proof cookie
    ForwardAuthMTLS: { type: mutualTLS, description: Dedicated ForwardAuth caller URI SAN }
    PluginMTLS: { type: mutualTLS, description: Dedicated connection-monitor caller URI SAN }
  schemas:
    Handle: { type: string, pattern: '^[a-f0-9]{64}$', minLength: 64, maxLength: 64 }
    Identity:
      type: object
      additionalProperties: false
      required: [issuer, subject]
      properties:
        issuer: { type: string, format: uri, maxLength: 2048 }
        subject: { type: string, minLength: 1, maxLength: 255, pattern: '^[!-~]+$' }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
  responses:
    Unauthenticated:
      description: Invalid or absent session; no destination
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Invalid service identity, origin or CSRF proof
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Invalid:
      description: Invalid or oversized request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Provider, persistence, refresh contention or installation gate unavailable; deny
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
