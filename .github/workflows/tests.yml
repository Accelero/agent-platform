name: Tests

# One runner per suite or shard (docs/testing.md). The release workflow calls
# this for every suite; a caller may select fewer suites, for example on main.
'on':
  workflow_call:
    inputs:
      suites:
        description: "'all' or comma-separated suite names from tests/support/suites.py"
        type: string
        default: all
  workflow_dispatch:
    inputs:
      suites:
        description: "'all' or comma-separated suite names from tests/support/suites.py"
        type: string
        default: all

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.14'
      - run: uv sync --locked
      - name: Collect every test and require a registered suite for each
        run: uv run pytest --collect-only -q --check-suites
      - id: plan
        name: Expand the selected suites into runners
        env:
          SUITES: ${{ inputs.suites }}
        run: echo "matrix=$(uv run python -m tests.support.suites matrix --select "$SUITES")" >> "$GITHUB_OUTPUT"

  suite:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.14'
      - if: matrix.helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: 'v3.22.1'
      - if: matrix.docker
        name: Set up BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: provenance-add-gha=false
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - if: matrix.docker
        name: Expose the masked cache runtime for read-only image cache use
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error(`Missing GitHub cache runtime variable: ${name}`);
              core.setSecret(value);
              core.exportVariable(name, value);
            }
      - run: uv sync --locked
      - name: Run ${{ matrix.name }}
        env:
          AGENT_PLATFORM_TEST_CACHE: ${{ matrix.docker && 'gha' || '' }}
          SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard }}
          REPORT: ${{ matrix.suite }}-${{ strategy.job-index }}
        run: >-
          uv run pytest -q -rfE --durations=15
          --suite "$SUITE" --shard "$SHARD"
          --junitxml ".local/tests/$REPORT.xml"
      - name: Upload the suite report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tests-${{ matrix.suite }}-${{ strategy.job-index }}
          path: .local/tests/*.xml
          if-no-files-found: ignore
          retention-days: 7
