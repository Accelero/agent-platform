name: Tests

# One runner per suite or shard (docs/testing.md). The release workflow calls
# this for every suite; a caller may select fewer suites, for example on main.
'on':
  workflow_call:
    inputs:
      suites:
        description: "'all' or comma-separated suite names from tests/support/suites.py"
        type: string
        default: all
  workflow_dispatch:
    inputs:
      suites:
        description: "'all' or comma-separated suite names from tests/support/suites.py"
        type: string
        default: all

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          python-version: '3.14'
      - run: uv sync --locked
      - name: Collect every test and require a registered suite for each
        run: uv run pytest --collect-only -q --check-suites
      - id: plan
        name: Expand the selected suites into runners
        env:
          SUITES: ${{ inputs.suites }}
        run: echo "matrix=$(uv run python -m tests.support.suites matrix --select "$SUITES")" >> "$GITHUB_OUTPUT"

  suite:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          python-version: '3.14'
      - if: matrix.helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: 'v4.3.1'
      - if: matrix.docker
        name: Set up BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: provenance-add-gha=false
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - if: matrix.docker
        name: Expose the masked cache runtime for read-only image cache use
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error(`Missing GitHub cache runtime variable: ${name}`);
              core.setSecret(value);
              core.exportVariable(name, value);
            }
      - run: uv sync --locked
      - name: Run ${{ matrix.name }}
        env:
          AGENT_PLATFORM_TEST_CACHE: ${{ matrix.docker && 'gha' || '' }}
          SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard }}
          REPORT: ${{ matrix.suite }}-${{ strategy.job-index }}
        run: >-
          uv run pytest -q -rfE --durations=15
          --suite "$SUITE" --shard "$SHARD"
          --junitxml ".local/tests/$REPORT.xml"
      - name: Upload the suite report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.suite }}-${{ strategy.job-index }}
          path: .local/tests/*.xml
          if-no-files-found: ignore
          retention-days: 7
