name: Release agent platform

'on':
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: agent-platform-release
  cancel-in-progress: false

jobs:
  validate:
    name: Release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          python-version: '3.14'
      - name: Validate sources and release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run python -m agent_platform.privacy
          uv run python - <<'PY'
          import os, tomllib
          from pathlib import Path
          import yaml
          from agent_platform.release import VERSION
          version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          assert VERSION.fullmatch(version), 'Release tag must be vMAJOR.MINOR.PATCH'
          assert yaml.safe_load(Path('charts/agent-platform/Chart.yaml').read_text())['version'] == version
          assert tomllib.loads(Path('pyproject.toml').read_text())['project']['version'] == version
          PY
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This release already exists. Publish a new version.' >&2
            exit 1
          fi

  tests:
    name: Tests
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    with:
      suites: all

  publish:
    needs: [validate, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    timeout-minutes: 110
    steps:
      - name: Check out release sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          python-version: '3.14'
      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: 'v4.3.1'
      - name: Install locked dependencies for the artifact tests
        run: uv sync --locked
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: provenance-add-gha=false
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Expose masked cache runtime to the build command
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error(`Missing GitHub cache runtime variable: ${name}`);
              core.setSecret(value);
              core.exportVariable(name, value);
            }
      - name: Authenticate image publishing
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate chart publishing
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build, verify and publish matching artifacts
        run: >-
          uv run python -m agent_platform.release
          --version "${GITHUB_REF_NAME#v}" --revision "$GITHUB_SHA" --publish --github-cache
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-diagnostics
          path: |
            .local/releases/*/build.log
            .local/releases/*/images-metadata.json
            .local/releases/*/artifact-tests.log
            .local/releases/*/artifact-tests.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload chart package and informational receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-release
          path: |
            .local/releases/*/artifacts.json
            .local/releases/*/*.tgz
          if-no-files-found: error
          retention-days: 90
      - name: Create versioned GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Agent platform $VERSION" \
            --notes "Self-contained application chart with pinned runtime images. The same chart package is attached here and published to GHCR. artifacts.json is informational." \
            ".local/releases/$VERSION/artifacts.json" \
            ".local/releases/$VERSION/agent-platform-$VERSION.tgz"
