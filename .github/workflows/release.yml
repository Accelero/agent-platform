name: Release agent platform

'on':
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write
  packages: write

concurrency:
  group: agent-platform-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Check out release sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.14'
      - name: Validate sources and release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv sync --locked
          uv run ruff check agent_platform tests
          uv run ruff format --check agent_platform tests
          uv run pytest -q
          uv run python - <<'PY'
          import os, tomllib
          from pathlib import Path
          import yaml
          from agent_platform.release import VERSION
          version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          assert VERSION.fullmatch(version), 'Release tag must be vMAJOR.MINOR.PATCH'
          assert yaml.safe_load(Path('charts/agent-platform/Chart.yaml').read_text())['version'] == version
          assert tomllib.loads(Path('pyproject.toml').read_text())['project']['version'] == version
          PY
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This release already exists. Publish a new version.' >&2
            exit 1
          fi
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: 'v3.22.1'
      - name: Authenticate image publishing
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate chart publishing
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build, verify and publish matching artifacts
        run: >-
          uv run python -m agent_platform.release
          --version "${GITHUB_REF_NAME#v}" --revision "$GITHUB_SHA" --publish
      - name: Upload release receipt and compatibility bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: agent-release
          path: |
            .local/releases/*/artifacts.json
            .local/releases/*/contract.zip
            .local/releases/*/*.tgz
          if-no-files-found: error
          retention-days: 90
      - name: Create versioned GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Agent platform $VERSION" \
            --notes "Versioned agent images, OCI Helm chart and matching deployment contract. See artifacts.json for manifest digests." \
            ".local/releases/$VERSION/artifacts.json" \
            ".local/releases/$VERSION/contract.zip" \
            ".local/releases/$VERSION/agent-platform-$VERSION.tgz"
