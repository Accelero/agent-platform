name: Checks

# Static checks only. Tests run on version tags through tests.yml; to add some
# suites here later, add a job that calls tests.yml with a `suites` selection.

'on':
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          python-version: '3.14'
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: 'v4.3.1'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m agent_platform.privacy
      - name: Collect every test and require a registered suite for each
        run: uv run pytest --collect-only -q --check-suites
      - run: helm lint charts/agent-platform
      - name: Render lightweight deployment
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from agent_platform.release import ROOT, render_chart
          output = Path('.local/checks')
          output.mkdir(parents=True)
          render_chart(output, ROOT / "charts/agent-platform")
          PY
