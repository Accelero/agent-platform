name: Checks

'on':
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.14'
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: 'v3.22.1'
      - run: uv sync --locked
      - run: uv run ruff check agent_platform tests
      - run: uv run ruff format --check agent_platform tests
      - run: uv run python -m agent_platform.privacy
      - run: uv run pytest -q
      - run: helm lint charts/agent-platform
      - name: Render manager deployment
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from agent_platform.release import ROOT, render_chart
          output = Path('.local/checks')
          output.mkdir(parents=True)
          render_chart(output, ROOT / "charts/agent-platform")
          PY

  hermes-manager:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/hermes-manager
    services:
      postgres:
        image: postgres@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
        env:
          POSTGRES_USER: hermes_test
          POSTGRES_DB: hermes_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermes_test -d hermes_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://hermes_test@127.0.0.1:5432/hermes_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.14'
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: services/hermes-manager/ui/.node-version
          cache: npm
          cache-dependency-path: services/hermes-manager/ui/package-lock.json
      - name: Build and check the dashboard contract
        working-directory: services/hermes-manager/ui
        run: |
          npm ci --ignore-scripts
          npm run check:generated
          npm run check:schemas
          npm run format:check
          npm test
          npm run build
      - name: Test the dashboard in Chromium
        working-directory: services/hermes-manager/ui
        run: |
          npx --no-install playwright install --with-deps chromium
          npm run test:e2e
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Check the protected production dashboard under its actual CSP
        run: MANAGER_UI_DIST="$PWD/ui/dist" cargo test -p hermes-adapters --test browser production_dashboard_browser_csp --locked -- --ignored
      - run: cargo build --workspace --bins --locked
      - name: Test API process and registry after abrupt termination
        run: uv run python ../../tests/personal_hermes/api_process.py --postgres-container '${{ job.services.postgres.id }}'
      - name: Test resource ownership with a disposable Kubernetes API server
        run: uv run python ../../tests/personal_hermes/kubernetes.py --postgres-container '${{ job.services.postgres.id }}'

  hermes-manager-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.14'
      - run: uv sync --locked
      - name: Build Rust and Vite from reviewed inputs without publication
        run: uv run python -m agent_platform.manager_build
      - name: Verify non-root runtime and production assets
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --entrypoint sh hermes-manager:local -c \
            'test "$(id -u)" = 10001 && test -s /usr/share/hermes-manager/ui/index.html && test -x /usr/local/bin/hermes-manager && ! command -v node'

  hermes-router-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.14'
      - run: uv sync --locked
      - name: Install the pinned Go toolchain
        env:
          GO_ARCHIVE_SHA256: 42d158b4d8f7b61ac0a830567c940a86098fb7aac52e467a5ebec03ef5cc2f8d
        run: |
          curl --fail --location --silent --show-error --max-time 120 \
            https://go.dev/dl/go1.26.9.linux-amd64.tar.gz --output "$RUNNER_TEMP/go.tar.gz"
          printf '%s  %s\n' "$GO_ARCHIVE_SHA256" "$RUNNER_TEMP/go.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/go.tar.gz" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
      - name: Go formatting, vet and race tests
        working-directory: plugins/hermes-route-resolver
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
      - name: Load Yaegi and test routing and open-WebSocket revocation
        run: uv run python tests/personal_hermes/router_compatibility.py
      - name: Verify native owner pin against the real Hermes provider
        run: uv run python tests/personal_hermes/native_owner.py

  hermes-personal-native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
        env:
          POSTGRES_USER: hermes_test
          POSTGRES_DB: hermes_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermes_test -d hermes_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.14'
      - run: uv sync --locked
      - name: Install the pinned Rust toolchain for native commissioning
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build reviewed context and verify non-root native startup and crash recovery
        run: uv run python -m tests.personal_hermes.native_runtime --build
      - name: Commission real per-user native instances and retain their PVC state
        run: uv run python -m tests.personal_hermes.kubernetes --native --postgres-container '${{ job.services.postgres.id }}'
