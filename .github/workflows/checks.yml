name: Checks

'on':
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.14'
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: 'v3.22.1'
      - run: uv sync --locked
      - run: uv run ruff check agent_platform tests
      - run: uv run ruff format --check agent_platform tests
      - run: uv run python -m agent_platform.privacy
      - run: uv run pytest -q
      - run: helm lint charts/agent-platform
      - name: Render manager deployment
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from agent_platform.release import ROOT, render_chart
          output = Path('.local/checks')
          output.mkdir(parents=True)
          render_chart(output, ROOT / "charts/agent-platform")
          PY

  hermes-manager:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: services/hermes-manager
    services:
      postgres:
        image: postgres@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
        env:
          POSTGRES_USER: hermes_test
          POSTGRES_DB: hermes_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermes_test -d hermes_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://hermes_test@127.0.0.1:5432/hermes_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: services/hermes-manager/ui/.node-version
          cache: npm
          cache-dependency-path: services/hermes-manager/ui/package-lock.json
      - name: Build and check the dashboard against its contract
        working-directory: services/hermes-manager/ui
        run: |
          npm ci --ignore-scripts
          npm run check:generated
          npm run check:schemas
          npm run format:check
          npm test
          npm run build
      - name: Test the dashboard in Chromium
        working-directory: services/hermes-manager/ui
        run: |
          npx --no-install playwright install --with-deps chromium
          npm run test:e2e
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Abort the API process around a commit
        run: cargo test -p hermes-manager --features fault-injection --test process --locked
      - name: Check the built dashboard under the real authentication and CSP
        run: MANAGER_UI_DIST="$PWD/ui/dist" cargo test -p hermes-http --test dashboard_browser --locked -- --ignored
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.14'
      - run: uv sync --locked
      - name: Test the controller with a disposable Kubernetes API server
        run: uv run python ../../tests/personal_hermes/kubernetes.py --postgres-container '${{ job.services.postgres.id }}'

  hermes-manager-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.14'
      - run: uv sync --locked
      - name: Build Rust and Vite from reviewed inputs without publication
        run: uv run python -m agent_platform.manager_build
      - name: Verify non-root runtime and production assets
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --entrypoint sh hermes-manager:local -c \
            'test "$(id -u)" = 10001 && test -s /usr/share/hermes-manager/ui/index.html && test -x /usr/local/bin/hermes-manager && test -x /usr/local/bin/hermes-gateway && ! command -v node'

  hermes-personal-native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
        env:
          POSTGRES_USER: hermes_test
          POSTGRES_DB: hermes_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermes_test -d hermes_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.14'
      - run: uv sync --locked
      - name: Install the pinned Rust toolchain for native commissioning
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build reviewed context and verify non-root native startup and crash recovery
        run: uv run python -m tests.personal_hermes.native_runtime --build
      - name: Verify native owner pin against the real Hermes provider
        run: uv run python tests/personal_hermes/native_owner.py
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: 'v3.22.1'
      - name: Build the manager image for the end-to-end run
        run: uv run python -m agent_platform.manager_build --tag hermes-manager:e2e
      - name: Install the chart and reach real native instances through the gateway with Keycloak
        run: uv run python -m tests.personal_hermes.kubernetes --native --postgres-container '${{ job.services.postgres.id }}'
