name: Build image cache

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache.yml'
      - '.github/workflows/release.yml'
      - 'agent_platform/**'
      - 'containers/**'
      - 'runtimes/**'
      - 'services/**'
      - 'tools/**'
      - 'vendor/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'release-policy.json'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-platform-main-cache
  cancel-in-progress: false

jobs:
  cache:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out main sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          python-version: '3.14'
      - name: Check reviewed build inputs; tests run only on release tags
        run: |
          uv sync --locked
          uv run python -m agent_platform.privacy
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: provenance-add-gha=false
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Expose masked cache runtime to the build command
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error(`Missing GitHub cache runtime variable: ${name}`);
              core.setSecret(value);
              core.exportVariable(name, value);
            }
      - name: Build all five caches without publishing images
        run: uv run python -m agent_platform.build
      - name: Upload bounded cache build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cache-build-log
          path: .local/cache/build.log
          if-no-files-found: ignore
          retention-days: 7
