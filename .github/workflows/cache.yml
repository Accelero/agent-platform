name: Build image cache

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache.yml'
      - '.github/workflows/release.yml'
      - 'agent_platform/**'
      - 'containers/**'
      - 'runtimes/**'
      - 'services/**'
      - 'contracts/**'
      - 'pyproject.toml'
      - 'release-policy.json'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-platform-main-cache
  cancel-in-progress: false

jobs:
  cache:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out main sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.14'
      - name: Set up Helm for application render tests
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: 'v3.22.1'
      - name: Check cache and release code
        run: |
          uv sync --locked
          uv run ruff check agent_platform tests
          uv run ruff format --check agent_platform tests
          uv run python -m agent_platform.privacy
          uv run pytest -q
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: provenance-add-gha=false
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Expose masked cache runtime to the build command
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error(`Missing GitHub cache runtime variable: ${name}`);
              core.setSecret(value);
              core.exportVariable(name, value);
            }
      - name: Build all five caches without publishing images
        run: uv run python -m agent_platform.build
      - name: Upload bounded cache build log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cache-build-log
          path: .local/cache/build.log
          if-no-files-found: ignore
          retention-days: 7
